name = "barovia-chronicle"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers AI binding: free daily allowance on Cloudflare's free plan, no API key.
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "https://cameron1288.github.io"
# Free allowance: 10,000 neurons/day, resets 00:00 UTC. This 70B model costs ~150 neurons
# per question (~65/day). If that runs out too early, switch to the smaller
# "@cf/meta/llama-3.1-8b-instruct-fp8-fast" (~25 neurons, ~400/day, weaker answers).
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Secret: set once with
#   npx wrangler secret put PARTY_CODE
