name: Build Flint APK
on:
  push:
    branches: [flint-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Copy the sheet into the app (fonts bundled for offline use)
        run: |
          mkdir -p android/app/src/main/assets
          python3 scripts/bundle_fonts.py web/index.html android/app/src/main/assets/index.html
          cp web/icon-192.png web/icon-512.png android/app/src/main/assets/
      - name: Publish the web app (its own flint/ folder on the GitHub Pages site)
        run: |
          python3 scripts/bundle_fonts.py web/index.html "$RUNNER_TEMP/flint-index.html"
          git fetch --depth=1 origin main
          git worktree add "$RUNNER_TEMP/site" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/site/flint"
          cp "$RUNNER_TEMP/flint-index.html" "$RUNNER_TEMP/site/flint/index.html"
          cp web/sw.js web/manifest.webmanifest web/icon-192.png web/icon-512.png "$RUNNER_TEMP/site/flint/"
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flint
          if git diff --cached --quiet; then echo "Web app unchanged"; exit 0; fi
          git commit -m "Flint web app v1.${{ github.run_number }} (flint/ folder only)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch --depth=20 origin main && git rebase FETCH_HEAD
          done
          exit 1
      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Flint-Cogsworth.apk
      - uses: actions/upload-artifact@v4
        with: { name: Flint-Cogsworth-apk, path: Flint-Cogsworth.apk }
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flint-v${{ github.run_number }}
          name: Flint Cogsworth app v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Flint-Cogsworth.apk
          make_latest: true
          body: Character sheet app for Flint Cogsworth. Download Flint-Cogsworth.apk on the tablet and open it to install or update.
