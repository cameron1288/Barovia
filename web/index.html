<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14120f"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Flint Cogsworth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a fixed gauge cluster (vitals + ability strip) above tabbed work panels, sized for a landscape tablet. Iron-and-ash ground, amber veins for Flint, violet for ectoplasm. */
:root{
  --soot:#14120f; --iron:#1d1a16; --iron2:#26221c; --iron3:#312c25; --line:#3d362c;
  --ash:#ebe4d6; --ash2:#b4aa97; --ash3:#7f7667;
  --amber:#f2a83b; --amber2:#9a6420; --amberglow:rgba(242,168,59,.14);
  --ecto:#b28cff; --ecto2:#5e3fa6; --ectoglow:rgba(178,140,255,.16);
  --blood:#e8604f; --heal:#63c49e; --warn:#e9c75a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--soot);color:var(--ash);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ash);background:var(--soot);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.45}
input[type=number]{width:72px;font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* ---------- gauge cluster ---------- */
.top{z-index:20;background:var(--soot);border-bottom:1px solid var(--line);padding-block:10px 8px}
.row1{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap}
.ident{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1 1 130px}
.ident h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:.5px;text-transform:uppercase}
.ident h1 span{color:var(--amber)}
.ident small{color:var(--ash2);font-size:13px}
.gauge{background:var(--iron);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:64px;text-align:center}
.gauge .lab{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ash2);font-weight:600}
.gauge .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.05}
.gauge.tap{cursor:pointer}
.gauge.tap:active{background:var(--iron2)}
.hp{flex:0 1 210px;align-items:stretch;cursor:pointer}
.hp .hpline{display:flex;align-items:baseline;gap:6px;justify-content:center}
.hp .val{font-size:32px}
.hp .max{color:var(--ash2);font-family:var(--f-mono);font-size:14px}
.hp .tmp{color:var(--ecto);font-family:var(--f-mono);font-size:14px;font-weight:600}
.bar{height:6px;background:var(--iron3);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--heal);transition:width .25s}
.bar i.low{background:var(--warn)} .bar i.crit{background:var(--blood)}
.ac .val{color:var(--amber)}
.ac .sub{font-size:10.5px;color:var(--ash2)}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.pip{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ecto2);background:transparent}
.pip.on{background:var(--ecto);border-color:var(--ecto);box-shadow:0 0 6px var(--ecto)}
.pip.st{border-color:#7a3a33}.pip.st.on{background:var(--blood);border-color:var(--blood);box-shadow:0 0 6px var(--blood)}
.energy{min-width:136px}.energy .val{color:var(--ecto)}
.stress .val{color:var(--blood)}
.ctl{display:flex;gap:4px;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--iron2);border-radius:5px;padding:1px 9px;font-weight:700;font-size:15px;line-height:1.3}
.mini:active{background:var(--iron3)}
.combatsw{flex:0 0 auto;min-width:92px;border:1.5px solid var(--line);background:var(--iron);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 10px}
.combatsw .sw{width:52px;height:28px;border-radius:14px;background:var(--iron3);position:relative;transition:background .2s}
.combatsw .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ash2);transition:left .2s,background .2s}
.combatsw.on{border-color:var(--blood);background:rgba(232,96,79,.1)}
.combatsw.on .sw{background:var(--blood)}
.combatsw.on .sw::after{left:27px;background:#fff}
.combatsw .lab{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}

.abil{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
body{display:flex;flex-direction:column;overflow:hidden}
.top{flex:none}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:100%;padding-bottom:70px}
#main.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:58px}
#main.fill > .grid{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr)}
#main.fill > .grid > .panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#main.fill .scrollbox{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
@media (max-width:680px){#main.fill{display:block;overflow-y:auto;padding-bottom:70px}#main.fill > .grid > .panel{overflow:visible}#main.fill .scrollbox{overflow:visible}}
.ab{background:var(--iron);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px 6px;text-align:center;position:relative;cursor:pointer}
.ab:active{background:var(--iron2)}
.ab .k{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--ash2)}
.ab .m{font-family:var(--f-display);font-size:23px;font-weight:700;line-height:1}
.ab .s{font-family:var(--f-mono);font-size:12px;color:var(--ash3)}
.ab .sv{display:inline-block;margin-top:3px;font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-family:var(--f-mono);background:var(--iron2)}
.ab .sv.p{border-color:var(--amber2);color:var(--amber)}
.ab .tag{position:absolute;top:3px;right:4px;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:0 4px;border-radius:3px}
.tag.dis{background:rgba(232,96,79,.18);color:var(--blood)}
.tag.adv{background:rgba(99,196,158,.18);color:var(--heal)}
.ab.san{border-style:dashed}
.ab.san .m{color:var(--ecto)}

.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ash3);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ash);border-bottom-color:var(--amber)}
.tab.cmb.on{border-bottom-color:var(--blood)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blood);margin-left:6px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.tab .dot{animation:none}*{transition:none!important}}

/* ---------- panels ---------- */
.grid{display:grid;gap:12px;margin-top:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gside{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:900px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.g2,.g3,.gside{grid-template-columns:minmax(0,1fr)}.abil{grid-template-columns:repeat(4,minmax(0,1fr))}.ident h1{font-size:24px}}
.panel{background:var(--iron);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .cnt{font-family:var(--f-mono);font-size:13px;font-weight:600;letter-spacing:0;padding:1px 8px;border-radius:10px;background:var(--iron3);color:var(--ash2)}
.cnt.full{background:rgba(233,199,90,.18)!important;color:var(--warn)!important}
.cnt.over{background:rgba(232,96,79,.2)!important;color:var(--blood)!important}
.panel h2 .sp{flex:1}
.panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ash2);margin:12px 0 6px;font-weight:700}
.muted{color:var(--ash2)} .dim{color:var(--ash3)}
.small{font-size:13px}
p{margin:0 0 6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--iron3);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--iron2)}
.bonus{font-family:var(--f-mono);font-weight:600;min-width:42px;text-align:right}
.prof{width:16px;text-align:center;color:var(--amber);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12.5px;background:var(--iron2);white-space:nowrap}
.chip.amber{border-color:var(--amber2);color:var(--amber)}
.chip.ecto{border-color:var(--ecto2);color:var(--ecto)}
.chip.red{border-color:#7a3a33;color:var(--blood)}
.chip.ok{border-color:#2f6b55;color:var(--heal)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--iron2);border-radius:6px;padding:6px 12px;font-weight:600;font-size:14px}
.btn:active{background:var(--iron3)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1b1206}
.btn.ecto{background:var(--ecto2);border-color:var(--ecto);color:#fff}
.btn.red{background:rgba(232,96,79,.15);border-color:var(--blood);color:var(--blood)}
.btn.ok{background:rgba(99,196,158,.14);border-color:var(--heal);color:var(--heal)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--iron2);font-weight:600;font-size:14px}
.tog.on{border-color:var(--amber);color:var(--amber);background:var(--amberglow)}
.tog .box{width:14px;height:14px;border-radius:3px;border:1.5px solid currentColor;display:inline-block}
.tog.on .box{background:currentColor}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv dt{color:var(--ash2)} .kv dd{margin:0}
.uses{display:flex;gap:4px;flex-wrap:wrap}
.use{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--amber2);background:var(--amber);cursor:pointer}
.use.spent{background:transparent;border-color:var(--line)}
details.rule{border-top:1px solid var(--iron3);padding:6px 0}
details.rule summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.rule summary::-webkit-details-marker{display:none}
details.rule summary::before{content:"▸";color:var(--amber);font-size:12px;transition:transform .15s}
details.rule[open] summary::before{transform:rotate(90deg)}
details.rule .body{padding:6px 0 2px 18px;font-size:14px;color:var(--ash2)}
details.rule .body ul{margin:4px 0;padding-left:18px}
.locked{opacity:.5}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:4px 6px;border-bottom:1px solid var(--iron3);text-align:left}
table.t th{color:var(--ash2);font-size:11px;letter-spacing:1px;text-transform:uppercase}

/* ---------- combat ---------- */
.turnbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(232,96,79,.08);border:1px solid #6a342d;border-radius:var(--r);padding:8px 12px;margin-top:12px}
.econ{display:flex;gap:6px;flex-wrap:wrap}
.eco{border:1.5px solid var(--heal);color:var(--heal);border-radius:16px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;background:transparent}
.eco.used{border-color:var(--line);color:var(--ash3);text-decoration:line-through}
.round{font-family:var(--f-display);font-size:24px;font-weight:800}
.oc{border:1.5px solid var(--line);border-radius:var(--r);padding:6px 12px;background:var(--iron2);font-weight:700;display:flex;gap:8px;align-items:center}
.oc.on{border-color:var(--blood);background:rgba(232,96,79,.16);color:#ffb3a8;box-shadow:0 0 12px rgba(232,96,79,.35)}
.oc.spent{opacity:.45}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--iron2);display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.opt:active{background:var(--iron3)}
.opt .on1{display:flex;gap:8px;align-items:baseline}
.opt .nm{font-weight:700;flex:1;min-width:0}
.opt .cost{font-family:var(--f-mono);font-size:12.5px;color:var(--ecto);white-space:nowrap}
.opt .meta{font-size:12.5px;color:var(--ash2)}
.opt.dis{opacity:.4}
.opt.ectoopt{border-left:3px solid var(--ecto)}
.opt.gad{border-left:3px solid var(--amber)}
.col{display:flex;flex-direction:column;gap:6px}
.colhead{font-family:var(--f-display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}

/* ---------- gadgets / items ---------- */
.gadget{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--iron2)}
.gadget.dep{opacity:.5}
.gadget .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvl{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--iron3);color:var(--ash2)}
.lvl.c{color:var(--heal)}
.fx{font-size:14px;color:var(--ash);margin-top:6px}
.flav{font-size:13px;color:var(--ash3);font-style:italic;margin-top:4px}
.stat{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ash2);margin-top:4px}
.stat b{color:var(--ash);font-weight:600}
.search{width:100%;margin-bottom:8px}
.itemrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--iron3)}
.itemrow .nm{min-width:0;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:3px}
.tier{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px}
.tier0{background:#2b2a26;color:#cfc6b2}.tier1{background:#24342c;color:var(--heal)}.tier2{background:#3a3220;color:var(--warn)}.tier3{background:#3f2320;color:var(--blood)}

/* ---------- overlays ---------- */
.modalbg{position:fixed;inset:0;background:rgba(8,7,5,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--iron);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px}
.modal h2{font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase;margin:0 0 10px;letter-spacing:.5px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.keypad button{padding:12px 0;font-size:20px;font-family:var(--f-mono);border:1px solid var(--line);background:var(--iron2);border-radius:8px}
.entry{font-family:var(--f-display);font-size:44px;font-weight:700;text-align:center;background:var(--soot);border:1px solid var(--line);border-radius:8px;padding:2px}
.rollbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--iron);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.rollbar .res{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rollbar .res b{font-family:var(--f-mono);color:var(--amber);font-size:17px}
.rollbar.flash{animation:fl .6s}
@keyframes fl{0%{background:var(--iron3)}100%{background:var(--iron)}}
.rollcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--iron2)}
.rollcard .big{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--amber);line-height:1}
.rollcard .big.ecto{color:var(--ecto)}
.rollcard .big.red{color:var(--blood)}
.status{font-size:12px;color:var(--ash3)}
.warnbox{border:1px solid #6b5a22;background:rgba(233,199,90,.08);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:13.5px;margin:6px 0}
.redbox{border:1px solid #7a3a33;background:rgba(232,96,79,.08);color:#ffb3a8;border-radius:6px;padding:6px 10px;font-size:13.5px;margin:6px 0}
.ectobox{border:1px solid var(--ecto2);background:var(--ectoglow);color:#dccbff;border-radius:6px;padding:6px 10px;font-size:13.5px;margin:6px 0}
.dsave{display:flex;gap:4px;align-items:center}
.dsave .use{border-radius:50%}
.edit input[type=number]{width:60px}
.sep{height:1px;background:var(--line);margin:10px 0}
.tell{font-size:16px;margin-top:6px;line-height:1.45}
.tell b{color:var(--amber);font-family:var(--f-mono)}
.askrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.askrow input{width:96px;font-size:20px;text-align:center}
.useddot{display:inline-flex;gap:3px;vertical-align:middle}.useddot i{width:11px;height:11px;border-radius:50%;background:var(--amber);display:inline-block}.useddot i.u{background:transparent;border:1.5px solid var(--ash3)}
.mult{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:1px 7px;border-radius:10px;background:var(--amber);color:#1b1206}
.setbtn .val{font-size:20px;line-height:1.2}
.modal.wide{max-width:720px}
.rollpop{cursor:pointer;max-width:520px}
.rollpop .what{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;color:var(--amber);margin:4px 0}
.rollpop .mode{font-weight:700;font-size:17px;padding:6px 10px;border-radius:6px;margin:6px 0}
.mode.adv{background:rgba(99,196,158,.16);color:var(--heal)}.mode.dis{background:rgba(232,96,79,.16);color:#ffb3a8}.mode.flat{background:var(--iron2);color:var(--ash2)}
.mode.fail{background:rgba(232,96,79,.25);color:#fff}
.rollpop ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.rollpop .tapclose{font-size:12px;color:var(--ash3);text-align:center;margin-top:12px;letter-spacing:.5px}
.dt-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dt-row .lab{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ash2);font-weight:700;min-width:84px}
.charlayout{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.charlayout > .grid{margin-top:0}
@media (max-width:760px){.charlayout{grid-template-columns:minmax(0,1fr)}}
.pimg{width:100%;max-height:420px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.pempty{aspect-ratio:3/4;max-height:360px;width:100%;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ash3);text-align:center;padding:16px}
.planpanel{margin-top:12px;border-color:var(--amber2);background:linear-gradient(0deg,var(--iron),var(--iron)),var(--iron)}
.plangrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.2fr);gap:8px}
@media (max-width:760px){.plangrid{grid-template-columns:minmax(0,1fr)}}
.slot{border:1.5px dashed var(--line);border-radius:8px;padding:8px 10px;min-height:64px;display:flex;flex-direction:column;gap:4px}
.slot.full{border-style:solid;border-color:var(--amber);background:var(--amberglow)}
.slot .lab{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ash2);font-weight:700}
.opt.planned{outline:2px solid var(--amber);outline-offset:-2px}
.subhead{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);font-weight:700;margin-top:6px}
.turnstate{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.6px;text-transform:uppercase;padding:2px 10px;border-radius:6px}
.turnstate.mine{background:var(--heal);color:#0d1f17}
.turnstate.wait{background:var(--iron3);color:var(--ash2)}

const FLAVOR = {"Acid Splash": {"c": "The Corrosive Atomizer", "d": "You raise a specialized glass syringe mounted to your wrist gauntlet and squeeze the pneumatic trigger. A pressurized valve snaps open, spraying a wide, atomized cone of highly concentrated vitriol that eats through flesh and armor alike."}, "Booming Blade": {"c": "The Harmonic Frequency Striker", "d": "You slam a tuning-fork device against the hilt of your weapon. The blade instantly begins to vibrate at a violent, pitch-black ultrasonic frequency. When it hits, it forces a dense pocket of acoustic pressure around the target that violently explodes if they try to move."}, "Create Bonfire": {"c": "The Phosphorus Thermite Capsule", "d": "You drop a miniature, spring-fused clockwork capsule onto the ground. The gears grind for a split second before the core ruptures, igniting a continuous, self-fueling chemical fire that violently vents heat upwards in a 5-foot square."}, "Dancing Lights": {"c": "The Phosphor-Drone Matrix", "d": "You open a small hatch on your pack, releasing up to four tiny, clockwork fireflies. These mini-drones hover on pressurized copper rotors, casting a harsh, chemical-green illumination that you steer using a remote control dial on your forearm."}, "Frostbite": {"c": "The Cryogenic Vent Valve", "d": "You point a sub-zero condenser tube at the target and crank the release wheel. A freezing spray of rapid-expansion liquid nitrogen instantly sweeps over the enemy, causing their muscles to seize and lock up from severe frostbite."}, "Green-Flame Blade": {"c": "The Sulfur-Fuel Injector", "d": "You trigger a small pump built into your weapon's grip, coating the edge of the blade in a highly volatile, sulfur-based oil. When the blade strikes, the impact triggers a spark, causing a sheets of roaring, green chemical fire to arc outward toward a secondary target."}, "Guidance": {"c": "The Tactical HUD Overclock", "d": "You tap an ally’s temple, attaching a small, non-magical wire clip to their ear. The module emits a high-frequency bio-metric pulse that sharpens their cognitive focus and realigns their balance for a split second, pointing out exact structural weak points."}, "Light": {"c": "The Radium Core Clasp", "d": "You screw a tiny, lead-shielded casing containing a glowing shard of radioactive radium onto an object. When you open the manual shutter, it projects a harsh, unblinking beam of cold illumination that pierces the darkness."}, "Lightning Lure": {"c": "The Harpoon Coil Magnet", "d": "You fire a spring-loaded, barbed copper harpoon line directly at a target. The moment the steel teeth bite, you throw a heavy knife-switch on your belt, sending a massive arc of high-voltage current down the line to magnetically yank them toward you."}, "Mage Hand": {"c": "The Pneumatic Grapple Rotor", "d": "You launch a three-clawed mechanical grabber attached to a spool of ultra-fine copper cable. Powered by a small, violently buzzing compressed-air turbine, it hovers and manipulates light objects at a distance under your direct remote guidance."}, "Magic Stone": {"c": "The Kinetic Impact Loader", "d": "You press up to three mundane pebbles into a specialized chemical chamber on your belt. The device rapidly coats the ammunition in an unstable nitrocellulose film, turning them into high-velocity kinetic shells that explode on impact when thrown or slung."}, "Mending": {"c": "The Arc-Welding Blowtorch", "d": "You don your protective goggles and click a miniature blowtorch into your hand. Over the course of a minute, you manually apply heat, liquid copper solder, and mechanical pressure to fuse torn leather, seal cracked glass, or re-weld broken iron gears."}, "Message": {"c": "The Shortwave Audio Transceiver", "d": "You flip a small antenna up from your collar and point a directional microphone at a target. Using a tightly focused, low-frequency acoustic beam, you broadcast a raspy, static-heavy radio signal straight into their ears, completely silent to anyone else."}, "Poison Spray": {"c": "The Sulfur-Gas Diffuser", "d": "You slam your heel down, venting an auxiliary exhaust pipe at your hip. A thick, choking cloud of highly toxic, greenish-yellow sulfurous gas billows outward in a brief, pressurized jet directly into the face of a nearby foe."}, "Prestidigitation": {"c": "The Multi-Utility Toolkit", "d": "You utilize an array of hidden micro-gadgets built into your sleeves. You use a microscopic blowtorch to heat food, a miniature static-collector to spark a candle, a chemical aerosol to spray a foul odor, or a mechanical stamp to print a temporary mark."}, "Ray of Frost": {"c": "The Compressed Cryo-Beam", "d": "You over-pressurize your pack’s coolant loop, firing a continuous, blinding stream of super-chilled chemical vapor from your Emitter. The beam rapidly calcifies the target's joints, coating them in a layer of heavy, movement-slowing ice."}, "Resistance": {"c": "The Bio-Static Regulator", "d": "You slap a small adhesive patch onto an ally’s skin. The internal copper needle injects a micro-dose of an adrenaline-stabilizing serum, hardening their physical nervous system against sudden shocks, poisons, or mental intrusions."}, "Shocking Grasp": {"c": "The High-Voltage Tesla Gauntlet", "d": "You slam a heavy capacitor switch, charging your copper-reinforced glove with a massive, crackling electrical current. When you touch an enemy, the sudden discharge violently disrupts their nervous system, completely freezing their reflexes."}, "Spare the Dying": {"c": "The Defibrillator Paddles", "d": "You tear open a hatch on your pack and slam two zinc plates onto a dying creature's chest. With a loud, mechanical whir-click, the pack discharges a precisely regulated electrical shock straight into their heart, instantly stabilizing their vital signs."}, "Sword Burst": {"c": "The Centrifugal Blade Ring", "d": "You stomp a pressure-plate on your boot, releasing a ring of spring-loaded, razor-sharp clockwork sawblades from your belt. The blades spin violently outward in a 5-foot radius on extended copper arms before snapping back into their housings."}, "Thorn Whip": {"c": "The Steel-Cable Winch", "d": "You fire a barbed, segmented steel cable from your forearm gauntlet. The barbed teeth dig into the enemy, and a high-speed internal gear winch instantly clicks into reverse, violently dragging the target up to 10 feet closer to your position."}, "Thunderclap": {"c": "The Sonic Percussion Blast", "d": "You forcefully slam your heavy mechanical gauntlets together. An explosive percussion cap built into the palms detonates, unleashing a deafening, localized shockwave of acoustic pressure that rattles the teeth of everyone standing near you."}, "Absorb Elements": {"c": "The Thermal Grid Dissipator", "d": "When hit by elemental energy, you slam a lever on your forearm gauntlet. An auxiliary intake grid on your pack vents a blast of cooling gas, catching the incoming shockwave and storing the kinetic friction as pressurized heat to fuel your next melee strike."}, "Alarm": {"c": "The Tripwire Bell Sentry", "d": "You spend a minute stringing out ultra-fine, almost invisible steel hair-wires across a doorframe or camp perimeter, anchoring them to a highly sensitive clockwork bell housing. If a wire is brushed, an internal spring tensioner snaps, letting loose a frantic mechanical alarm."}, "Arcane Weapon": {"c": "The Core Elemental Injector", "d": "You slap a modular chemical cylinder onto your weapon's chamber. By turning a selector dial, you route pressurized tubes of acid, cold, fire, lightning, or poison along the blade or barrel, constantly bathing your strikes in volatile chemical coating."}, "Catapult": {"c": "The Pneumatic Rail-Sling", "d": "You point an over-cranked magnetic cylinder at a nearby object. With a violent hiss of compressed air, the high-pressure pneumatic piston generates massive kinetic force, violently launching the object forward like an invisible cannonball."}, "Cure Wounds": {"c": "The Pneumatic Stabilizing Syringe", "d": "You slam a heavy brass gun syringe into an ally's flesh. The spring-loaded needle violently injects a precisely measured dose of a highly concentrated, coagulating adrenaline cocktail that instantly seals ruptured flesh and stops internal bleeding."}, "Detect Magic": {"c": "The Ultraviolet Radiation Lens", "d": "You click a series of multi-layered amber and violet lenses down over your goggles. You manually calibrate the focus wheel, filtering out normal light spectrums to reveal the ambient humming radiation and heat signatures left behind by active arcane matrixes."}, "Disguise Self": {"c": "The Light-Refraction Shimmer Mesh", "d": "You attach a network of tiny copper pins to your coat and collar. When activated, the modules emit a localized, light-bending camouflage field that forms a pixelated, slightly flickering static illusion around your physical silhouette, masking your clothes and height."}, "Expeditious Retreat": {"c": "The Hydraulic Knee-Brace Overclock", "d": "You engage a high-pressure pump on your thighs, locking your legs into a pair of heavy pneumatic exoskeleton frames. The continuous, rapid pumping of the pistons forces your dead legs into a frantic, high-speed mechanical sprint."}, "Faerie Fire": {"c": "The Phosphorus Flareshot", "d": "You launch a small, pressure-fused glass canister into the air over the target area. The casing shatters with a loud crack, showering everything in a 20-foot cube with a sticky, glowing mist of highly luminescent amber phosphorus that cannot be easily wiped off."}, "False Life": {"c": "The Adrenaline Coagulant Pump", "d": "You activate a slow-release medical tube stitched into your coat. A cocktail of chemical stimulants and artificial numbing agents floods your unliving system, dulling your pain receptors and giving your dead flesh a surge of temporary physical durability."}, "Feather Fall": {"c": "The Compressed Air Drag-Chute", "d": "As you or an ally plunge downward, you trigger an explosive percussion cap on your belt. A blast of highly compressed carbon dioxide vents violently upward, creating a continuous column of pocketed air resistance that slows the descent to a safe, steady glide."}, "Grease": {"c": "The Lard-Aerosol Canister", "d": "You roll a pressurized iron canister across the floor. When it strikes the target point, the nozzle shears off, spraying a wide, thick sheet of super-slick, non-flammable tallow oil that instantly turns a 10-foot square of stone into a treacherous hazard."}, "Identify": {"c": "The Occult Diagnostic Matrix", "d": "You spend a minute clamping a magic item or relic into a heavy brass frame wired to your pack. You flip diagnostic toggles, tracking how the object reacts to electrical currents, magnetic fields, and lens magnification to mathematically deduce its features."}, "Jump": {"c": "The Pneumatic Boot Springs", "d": "You lock two massive, tightly wound steel coils onto the soles of an ally's boots. When they bend their knees, a mechanical trigger releases the tension, yanking the spring straight down and launching the wearer into a massive, calculated leap."}, "Longstrider": {"c": "The Kinetic Ankle-Tensioners", "d": "You wrap spring-loaded leather tension bands tightly around an ally's calves and ankles. The clockwork gears inside the straps store the kinetic energy of each step they take and release it on the upswing, naturally lengthening their stride and boosting speed."}, "Purify Food and Drink": {"c": "The Centrifugal Chemical Filter", "d": "You drop a miniature, hand-cranked brass filter unit into a container of liquid or pass a specialized UV-light rod over a plate of food. The device rapidly extracts or burns away toxins, sulfur, and rot, rendering the substance completely sterile."}, "Sanctuary": {"c": "The High-Frequency Sensory Scrambler", "d": "You activate a small, ticking brass module on an ally's belt. The gadget continuously broadcasts a discordant, high-frequency acoustic whine and a jarring strobe light that violently disrupts the target-acquisition senses of any monster trying to attack them."}, "Snare": {"c": "The Spring-Loaded Steel Winch", "d": "You spend a minute burying a heavy, spring-loaded iron clamping winch in the dirt and camouflaging it with mud and leaves. When a creature steps on the hidden trigger plate, the internal clockwork snaps shut, firing a corded wire loop up around its leg to hoist it into the air."}, "Tasha's Caustic Brew": {"c": "The Vitriol Firehose", "d": "You point a thick copper nozzle attached to a glass chemical tank on your hip. When you pull the primary lever, the pack violently pumps out a stream of thick, bubbling, greenish-black acid that shoots down a 30-foot line, melting anything it clings to."}, "Aid": {"c": "The Multi-Injecting Bio-Strayer", "d": "You throw a centralized chemical distributor onto the ground. The machine clicks loudly, firing up to three auto-targeting misting needles that punch into your allies' gear, injecting a timed-release combat steroid that artificially bolsters their physical resilience and pain thresholds."}, "Air Bubble": {"c": "The Brass Respirator Dome", "d": "You clamp a specialized, non-magical ventilation collar around a creature’s neck. A compact, humming oxygen-scrubbing canister on the device filters out moisture and toxic miasma, generating a localized field of clean, highly pressurized, breathable air around their head."}, "Alter Self": {"c": "The Biomechanical Flesh-Warp Harness", "d": "You lock an adjustable leather-and-iron harness tightly around your torso. By pulling heavy mechanical cords, the device uses internal hydraulic clamps and under-skin needles to painfully physically stretch your vocal cords, deploy clockwork gill-vents at your neck, or mechanically extend hidden metal claws from your gauntlets."}, "Arcane Lock": {"c": "The High-Voltage Magnetic Deadbolt", "d": "You bolt an experimental, heavy iron magnetic casing directly over a door latch, window, or chest lid. You throw an activation latch, forcing a powerful electromagnetic current to permanently weld the mechanism shut until you input the physical bypass code."}, "Blur": {"c": "The High-Frequency Vibration Displacer", "d": "You click a heavy flywheel switch on your belt. Your entire physical form begins to rapidly and violently vibrate at an extreme, blinding frequency. To the naked eye, your silhouette becomes a distorted, shifting smudge, making it nearly impossible for enemies to accurately target you."}, "Continual Flame": {"c": "The Radium-Phosphorus Wick", "d": "You brush an object with an experimental, slow-burning compound of synthetic white phosphorus and crushed radium dust. The unique chemical reaction creates a brilliant, self-sustaining flame that burns completely without heat, fuel, or oxygen, lasting indefinitely."}, "Darkvision": {"c": "The Infrared Light-Amplifier Lens", "d": "You attach a specialized multi-tiered scope directly to a target's goggles or glasses. The internal treated lenses capture and amplify microscopic thermal wavelengths, filtering the shadows into a distinct, high-contrast monochrome image that maps out the darkness."}, "Enhance Ability": {"c": "The Neuro-Muscular Overclock Patch", "d": "You slap a heavy, humming copper capacitor patch onto a target's body. The device continuously emits precisely timed electrical micro-shocks that force their muscle fibers to over-contract (boosting strength/agility) or flood their brain with adrenaline to heighten cognitive clarity."}, "Enlarge/Reduce": {"c": "The Molecular Density Compress-Ray", "d": "You point a multi-chambered lens barrel at a creature or object and manipulate a heavy focus ring. The Emitter discharges a concentrated pulse of high-frequency kinetic radiation that violently contracts or expands the atomic bonds of the target, altering their physical volume and weight."}, "Heat Metal": {"c": "The High-Output Induction Beam", "d": "You aim your main emitter nozzle at a metallic object and squeeze the internal coil trigger. The pack fires a continuous, invisible electromagnetic induction wave that forces the metallic atomic structure of the target's armor or weapon to rapidly friction-heat until it glows white-hot."}, "Invisibility": {"c": "The Light-Refraction Pixel Cape", "d": "You pull a heavy cloak lined with hundreds of microscopic glass prism mirrors over a target. When you slam the primary generator switch on their belt, the mirrors align perfectly, actively catching the light from behind them and projecting it forward to completely erase their silhouette."}, "Kinetic Jaunt": {"c": "The Pressurized Pneumatic Thrusters", "d": "You trigger a pair of auxiliary compressed-air vents built into the calves of your boots. Small, high-pressure directional jets blast soot and air downward with every step you take, physically boosting your momentum so you can glide effortlessly through a crowded battlefield without drawing strikes."}, "Lesser Restoration": {"c": "The Anti-Toxin Injector Gun", "d": "You press a heavy pneumatic needle gun directly against a creature's neck and pull the trigger. With a violent thud, the device forces a highly concentrated, broad-spectrum anti-toxin serum and optical-cleansing flush into their bloodstream, neutralizing poisons, blindness, or diseases."}, "Levitate": {"c": "The Localized Anti-Gravity Repeller", "d": "You fire a magnetic, disc-shaped anchor plate at a target. Once attached, you crank a dial on your wrist controller, forcing the disc's internal gyroscopes to spin at a manic speed that actively repels the ground's gravitational pull, raising them into the air."}, "Magic Mouth": {"c": "The Proximity-Fused Phonograph", "d": "You spend a minute drilling a miniature clockwork phonograph horn into a surface and setting a series of microscopic trigger tripwires. You speak into the horn to record a 25-word message on an internal wax cylinder; when the sensory wires are breached, the mechanical mouth springs open to blast the recording."}, "Magic Weapon": {"c": "The Kinetic Balancing Calibration", "d": "You use your tinker's tools to rapidly adjust a weapon's weight distribution, clamp an advanced, high-friction sharpening guide onto the blade, or add a counter-weight recoil guide to the hilt, physically maximizing its accuracy and lethal impact."}, "Protection from Poison": {"c": "The Inoculation Filter Patch", "d": "You apply an adhesive, needle-lined chemical patch directly over a creature’s main artery. The device slowly and continuously filters their blood through a charcoal-based mesh while pumping in a steady stream of defensive counter-agents that neutralize toxic substances."}, "Pyrotechnics": {"c": "The Magnesium Flash Canister", "d": "You throw a specialized, highly unstable chemical explosive directly into an active fire source. The moment the fuse touches the flame, the canister ruptures, completely consuming the fuel to create either a blinding, high-intensity magnesium flash or a massive, billowing cloud of choking black soot."}, "Rope Trick": {"c": "The Spatial-Phase Winch Hook", "d": "You launch a heavy brass winch block straight up into the air. When it reaches its apex, it deploys a localized, high-frequency electromagnetic field that locks the hook onto a stable, unseen gravitational fold in space. A 60-foot rope drops down, allowing allies to climb up into a cloaked, suspended platform."}, "See Invisibility": {"c": "The Quantum-Phase Filter Goggles", "d": "You use a small wrench to shift a secondary, multi-layered crystalline lens down over your eyes. This lens filters out the standard light spectrum, allowing you to clearly track the unique electromagnetic heat signatures and spatial distortions left behind by invisible or ethereal entities."}, "Skywrite": {"c": "The Pressurized Vapor Mortar", "d": "You launch a heavy, copper-finned chemical missile directly into the upper atmosphere. At its peak, the shell detonates, venting a highly concentrated, slow-dissipating chemical vapor that expands to form precise, dark soot letters against the sky, visible for miles."}, "Spider Climb": {"c": "The Micro-Hook Gauntlets & Soles", "d": "You equip a target with specialized, heavy leather gloves and boots lined with thousands of microscopic, spring-loaded steel hooks and pressurized suction cups. The pneumatic assist pumps click with every step, allowing them to scale walls and hang from ceilings."}, "Vortex Warp": {"c": "The Spatial Displacement Projector", "d": "You lock onto a creature with your main Emitter barrel and charge your pack's massive central capacitor. When you pull the primary lever, a blinding, high-voltage arc-flash violently collapses the spatial coordinates around the target, yanking them through an envelope of raw compression to snap-rebuild them at a different point within 90 feet."}, "Web": {"c": "The Pressurized Liquid-Latex Mortar", "d": "You shoulder a multi-barreled canister launcher and fire a heavy steel shell at a point within 60 feet. The canister explodes on impact, violently spraying a massive, rapidly expanding web of sticky, fast-hardening liquid latex fibers that glues creatures to the floor and walls."}};

const R = n => 1+Math.floor(Math.random()*n);

 let total=0, parts=[], m, re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;

  if(m[3]){ const n=+(m[2]||1), f=+m[3], sgn=m[1]==="-"?-1:1, rs=[]; for(let i=0;i<n;i++) rs.push(R(f)); const sum=rs.reduce((a,b)=>a+b,0); total+=sgn*sum; parts.push({d:`${n}d${f}`,rs}); }
  else if(m[5]){ const v=(m[4]==="-"?-1:1)*(+m[5]); total+=v; parts.push({mod:v}); }

}

function rollFactors(kind, abil, skill){

  const fail=["Paralyzed","Stunned","Unconscious","Petrified"].filter(k=>c[k]);
  if((abil==="str"||abil==="dex") && fail.length) auto.push(`${fail.join(", ")}: you automatically fail Str and Dex saves`);

 }
 if(kind==="attack"){
  if(S.exh>=3) dis.push("Exhaustion "+S.exh+" (disadvantage on attack rolls)");

 if(kind==="check" && (skill==="History"||skill==="Investigation")) notes.push(`Relic Scholar: if it's about magic items, cursed relics, undead anatomy, Castle Ravenloft or the Amber Temple, add your proficiency again (+${PB()}).`);
 if(S.insp) notes.push("You have Inspiration: you can spend it for advantage.");

     <div class="hd"><span class="tier tier${v.tier}">T${v.tier}</span><b style="flex:1;min-width:0">${esc(v.n)}</b>${i===0&&n>=cap?'<span class="chip red">Oldest, snaps next</span>':""}<button class="btn sm" data-act="scrapInv" data-i="${i}">Scrap</button></div>

   ${UI.wbResult||""}

  <div class="panel"><h2>Idea book</h2>

/* ======================= RENDER: GEAR ======================= */
function coinBlock(){ return `<div class="btns" style="margin-top:6px">${["cp","sp","ep","gp","pp"].map(k=>`<label class="small">${k.toUpperCase()} <input type="number" id="coin-${k}" data-bind="coins.${k}" value="${S.coins[k]}"></label>`).join("")}<label class="small">Scrap (gp) <input type="number" id="coin-scrap" data-bind="scrap" value="${S.scrap}"></label></div><p class="small dim" style="margin-top:4px">Coins count 50 to the pound. Total gear weight ${weight().toFixed(1)} of ${B().str*15} lb.</p>`; }

  <div class="nm"><b>${esc(it.n)}</b> ${it.fx&&fxOn(it.fx)?'<span class="chip amber">Modified</span>':""} ${it.att?'<span class="chip ecto">Attuned</span>':""}

  <span class="num small dim">${(+it.w||0)*(+it.q||0)} lb</span>

 </div>`;
}

/* ======================= RENDER: FEATURES ======================= */
const R_ = (t,b,cls="") => `<details class="rule ${cls}"><summary>${t}</summary><div class="body">${b}</div></details>`;
function renderFeatures(){
 const L=B().level;
 return `<div class="grid g2">
 <div class="panel"><h2>Spirit Engine</h2>
  ${R_("Æther-Pack",`<p>A containment engine strapped to your back: iron tank of swirling violet ectoplasm, gauges, copper pipes, control wand and foot pedal. Counts as an artificer's tool. If lost or destroyed, rebuild it on a long rest with tinker's tools and 25 gp of materials.</p><p>Holds up to <b>${eMax()}</b> Energy (5 + INT mod). On a long rest you lose half your stored Energy (rounded up), unless you take 1 Stress to keep it (up to 5 Stress total).</p>`)}
  ${R_("Soul Vacuum",`<p>Reaction when a hostile creature of CR ¼ or higher dies within 30 ft. Its essence is ripped into the pack.</p><table class="t"><tr><th>CR</th><th>Energy</th></tr>${SV_TABLE.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join("")}</table><p style="margin-top:6px"><b>Backlash:</b> energy above capacity isn't captured; you or an adjacent creature takes 1 necrotic per excess point.<br><b>Containment Breach:</b> if any die shows a 4, roll d100 on the wild table.</p>`)}
  ${R_("Ectoplasmic Discharge",`<p>Bonus action, uses INT, counts as an Occult-Tech Blueprint (Overclock applies).</p><ul><li><b>Proton Bolt (1):</b> ranged spell attack, 60 ft, 2d8 force.</li><li><b>Proton Stream (3):</b> 30-ft by 5-ft line, Dex save, 2d8 force, half on success.</li><li><b>Containment Burst (4):</b> 10-ft-radius sphere within 60 ft, Str save, 2d8 force and pushed 10 ft from the centre; half and no push on success.</li><li><b>Full Proton Overload (5):</b> one creature within 60 ft, Str save, 6d8 force and restrained until the end of your next turn (repeats the save at the end of its turns); half and not restrained on success.</li></ul>`)}
  ${R_("Soul-Sight · Soul-Targeted Strikes",`<p>You see the thread between body and soul. Once per turn, when a spell attack beats the target's AC by 5 or more, add <b>${L>=15?"3d6":L>=9?"2d6":"1d6"}</b> force.</p>`)}
  ${R_("Guiding Spark",`<p>Reaction when a creature you can see within 60 ft saves against your Blueprint or Discharge: it subtracts 1d4. Once per short or long rest.</p>`)}
  ${R_("Seriach's Fuel",`<p>Once per long rest, as an action while the pack is at 0 Energy: gain 1 to 5 Stress (never above 5) and the same amount of Energy.</p>`)}
  ${L>=9||S.settings.showLocked?R_("Level 9 · Recalibration & Tactical Vents",`<p>Pick one configuration after each rest. Whenever you spend 3+ Energy in a turn, its Vent triggers.</p><ul><li><b>Kinetic Deflector:</b> reaction, 2 Energy, reduce damage by 1d10 + INT; at 0, half cover. Vent: +2 AC to your next turn.</li><li><b>Arcane Capacitor:</b> +1 Energy to give an ally +2 AC, a one-level upcast, or resistance to the next damage. Vent: up to 3 creatures in 30 ft get 1d8 + INT temp HP and a free 10-ft move.</li><li><b>Offensive Exhaust:</b> once per turn when you deal damage, a creature within 5 ft of the target takes INT force. Vent: Dex save or 2d6 force to chosen creatures within 5 ft.</li><li><b>Hybrid Regulator:</b> +30 ft discharge range, temp HP equal to Energy spent for a creature within 10 ft, +1 to hit for you and those within 5 ft. Vent: +10 ft move and a free 10-ft move.</li></ul>`, L>=9?"":"locked"):""}
  ${L>=15||S.settings.showLocked?R_("Level 15 · Master of the Æther",`<ul><li><b>Perfect Containment:</b> Soul Vacuum 60 ft; roll capture twice and choose, INT mod times per long rest.</li><li><b>Ectoplasmic Mastery:</b> Proton Bolt costs 0; once per turn reduce a discharge cost by 1 (minimum 1).</li><li><b>Final Containment:</b> once per long rest at 0 HP, drop to 1 instead, gain 5 Energy, creatures within 15 ft Str save or 4d8 force and pushed 15 ft. Then +2 Stress and no Soul Vacuum until a long rest.</li></ul>`, L>=15?"":"locked"):""}
 </div>
 <div class="grid" style="margin-top:0">
 <div class="panel"><h2>Artificer, reworked</h2>
  ${R_("Blueprint Protocol",`<p>No spell slots and no natural casting. Your spells are physical gadgets.</p><ul><li>Carry up to <b>${gadgetCap()}</b> gadgets (level + INT).</li><li>Deploying one replicates the spell; levelled gadgets are then depleted. Cantrips don't deplete.</li><li>Short or long rest: reset depleted gadgets. Long rest: swap the whole load-out.</li><li>Spell save DC = 8 + prof + INT + CHA = <b>${DC()}</b>. Attack = prof + INT + CHA = <b>${sg(ATK())}</b>.</li><li>R&amp;D: spend downtime hours equal to the spell's level (1 for cantrips) to add a blueprint to your catalogue.</li></ul>`)}
  ${R_("Overclock Protocol",`<p>Once per turn, when you deploy a gadget or attack with a custom creation, take 1 Stress before rolling. Seriach channels through the machine: +3 to that spell attack roll, or +3 to that save DC and damage roll.</p>`)}
  ${R_("Mechanical Modifications",`<p>Your infusions are now clockwork, springs and bolted plating with the same mechanical bonuses. You can maintain <b>${modCap()}</b> at level ${L}. Re-rig them on a long rest with your tools. Mark which items are modified on the Gear tab; their effects only appear in combat when modified.</p>`)}
  ${R_("Malignant Tinkering",`<p>Build Tiny devices: 1 hour and 1d10 gp each, d100 against the DM's tier. Up to <b>${invCap()}</b> active (INT mod). See the Tinkering tab.</p>`)}
 </div>
 <div class="panel"><h2>Amber-Veined Gnome</h2>
  ${R_("Core changes",`<ul><li>Charisma rose to 11.</li><li>Fire resistance.</li><li>Disadvantage on Wisdom saving throws.</li><li>Fire Bolt and Scorching Ray from your arm (Isek's amber). Scorching Ray needs a Con save to withstand the energy.</li></ul>`)}
  ${R_("Unliving Stasis",`<p>No sleep needed; can't be magically put to sleep. One breath per minute; immune to suffocation.</p>`)}
  ${R_("Gloomvision",`<p>Darkvision 60 ft, and your eyes cut through the Barovian mists where others are blinded.</p>`)}
  ${R_("Grave Resilience",`<p>Advantage on all Sanity/Composure saving throws.</p>`)}
  ${R_("Relic Scholar · Artificer's Lore",`<p>Double proficiency on Intelligence (History) or (Investigation) about magic items, cursed relics, undead anatomy, Castle Ravenloft and the Amber Temple, and History checks about magic, alchemical and technological items.</p>`)}
  ${R_("The cost",`<ul><li><b>Infusions severed:</b> old infusions and Artillerist features are gone.</li><li><b>The Mother's Loss:</b> without the amber shard from your foster mother, her face, hands and voice are slowly slipping away.</li><li><b>New flaw:</b> cold machine logic. You can build weapons and survival rigs but can no longer create art, whimsy or joy.</li></ul>`)}
 </div>
 <div class="panel"><h2>Feats &amp; background</h2>
  ${R_("Fractured Genius",`<p>+1 to a stat, +1 Sanity. <b>Whispers of the Mad:</b> when you fail a Sanity check, ask the DM one yes/no question about your situation. <b>Isolated Insight:</b> Guiding Bolt once per long rest using INT.</p>`)}
  ${R_("Occult Insight",`<p>Action or bonus action: learn something about a creature or what it did. DC = 8 + the creature's CR (or spell level). On a failure, gain 1 Stress; you saw something you weren't ready for.</p>`)}
  ${R_("Investigator · Official Inquiry",`<p>Fast talk, determination and official-looking papers get you access to a place or person tied to a crime you're investigating. Uninvolved people avoid impeding you or pass your requests along. Local law sees you as a nuisance or one of their own.</p>`)}
 </div></div></div>`;
}

/* ======================= RENDER ROOT ======================= */
const PERSON = () => S.settings.rollMode==="person";
const showFl = () => S.settings.showFlavour!==false;
function applySettings(){
 const z={normal:"",large:"1.15",xl:"1.3"}[S.settings.textSize]||"";
 if(document.body.style.zoom!==z) document.body.style.zoom=z;
 try{ if(window.AndroidBridge && AndroidBridge.setKeepAwake) AndroidBridge.setKeepAwake(!!S.settings.keepAwake); }catch(e){}
 const b=document.getElementById("rmode"); if(b) b.textContent=PERSON()?"Rolling: in person":"Rolling: in app";
 const h=document.getElementById("rollhint"); if(h) h.textContent=PERSON()?"In-person rolling: tap anything and the app tells you what to roll.":"Tap any attack, skill, ability or gadget to roll.";
}
function render(){
 applySettings();
 renderTop();
 const m=document.getElementById("main");
 if(!TABS.some(t=>t[0]===UI.tab)){ UI.tab="sheet"; renderTop(); }
 const f={sheet:renderSheet,combat:renderCombat,gadgets:renderGadgets,tinker:renderTinker,gear:renderGear,background:renderBackground,mods:renderMods}[UI.tab]||renderSheet;
 const keep = UI.lastTab===UI.tab ? {main:m.scrollTop, boxes:[...m.querySelectorAll(".scrollbox")].map(x=>x.scrollTop)} : null;
 m.classList.toggle("fill", UI.tab==="gadgets");
 m.innerHTML=f();
 if(keep){ m.scrollTop=keep.main; m.querySelectorAll(".scrollbox").forEach((x,i)=>{ if(keep.boxes[i]!=null) x.scrollTop=keep.boxes[i]; }); }
 UI.lastTab=UI.tab;
}

/* ======================= MODALS ======================= */
function modal(html){ document.getElementById("modal").innerHTML=`<div class="modalbg" data-act="closeBg"><div class="modal" role="dialog">${html}</div></div>`; }
function closeModal(){ document.getElementById("modal").innerHTML=""; }
let KP={v:"",type:"",res:false};

 const dtypes=["","fire","necrotic","slashing","piercing","bludgeoning","cold","acid","lightning","thunder","poison","psychic","radiant","force"];
 modal(`<h2>Hit points</h2>

  <div class="btns"><button class="btn red" data-act="kpApply" data-k="dmg">Take damage</button><button class="btn ok" data-act="kpApply" data-k="heal">Heal</button><button class="btn ecto" data-act="kpApply" data-k="temp">Set temp HP</button><button class="btn ok" data-act="kpApply" data-k="bonus">Add to max HP</button><button class="btn" data-act="close">Close</button></div>
  ${S.hp.cur===0?`<div class="sep"></div><h3>Death saves</h3><div class="btns"><span class="dsave">Successes ${[0,1,2].map(i=>`<span class="use ${i<S.ds.s?"":"spent"}" data-act="ds" data-k="s" data-i="${i}"></span>`).join("")}</span><span class="dsave">Failures ${[0,1,2].map(i=>`<span class="use ${i<S.ds.f?"":"spent"}" data-act="ds" data-k="f" data-i="${i}" style="${i<S.ds.f?"background:var(--blood);border-color:var(--blood)":""}"></span>`).join("")}</span><button class="btn sm" data-act="dsRoll">Roll death save</button></div>`:""}

/* ======================= USE OPTIONS (combat) ======================= */
function spendEco(slot){ if(S.combat.on){ S.combat[slot]=true; } }
const SLOT = t => t==="b"?"bon":t==="r"?"rea":"act";
function ocApply(){ if(!S.combat.oc) return 0; S.combat.oc=false; S.combat.ocUsed=true; setStress(S.stress+1,"Overclock"); return 3; }
function tellCard(label,ocB,lines){ return `<div class="rollcard"><div class="muted small">${esc(label)} · roll at the table${ocB?' <span class="chip red">Overclocked</span>':""}</div>${lines.map(l=>`<div class="tell">${l}</div>`).join("")}</div>`; }
function attackModeLine(){ const f=rollFactors("attack"); if(!f.mode) return ""; const why=[...f.adv.map(x=>"advantage: "+x),...f.dis.map(x=>"disadvantage: "+x)].join("; ");
 return f.mode==="adv"?`<span style="color:var(--heal)">Roll with <b>advantage</b> (${esc(why)}).</span>`:f.mode==="dis"?`<span style="color:#ffb3a8">Roll with <b>disadvantage</b> (${esc(why)}).</span>`:`<span class="muted">Advantage and disadvantage cancel (${esc(why)}).</span>`; }
function resolveAttack(label,atkB,dmgExpr,dt,ocB,spell){
 const am=attackModeLine();
 if(PERSON()){ const ex=String(dmgExpr).replace(/@int/g,M("int")), cd=diceOnly(dmgExpr);
  const lines=[`Roll <b>d20 ${sg(atkB+ocB)}</b> to hit${ocB?" (includes Overclock +3)":""}.`,...(am?[am]:[]),`On a hit, roll <b>${ex}</b> ${dt} damage.`,`Natural 20: also roll <b>${cd}</b> extra.`];
  if(spell!==false) lines.push(`Beat its AC by 5 or more: add <b>${B().level>=15?"3d6":B().level>=9?"2d6":"1d6"}</b> force (Soul-Targeted, once per turn).`);
  pushRoll(label,"",`Roll <b>d20 ${sg(atkB+ocB)}</b>, then <b>${ex}</b> ${dt}`); return tellCard(label,ocB,lines); }
 const fm=rollFactors("attack").mode; let a=R(20),b=R(20); if(fm==="adv"){ const t=Math.max(a,b); b=Math.min(a,b); a=t; } else if(fm==="dis"){ const t=Math.min(a,b); b=Math.max(a,b); a=t; } const bonus=atkB+ocB;
 const d=roll(dmgExpr), crit=roll(diceOnly(dmgExpr));
 const html=`<div class="rollcard"><div class="muted small">${esc(label)}${ocB?' <span class="chip red">Overclocked +3</span>':""}</div>
  <div class="btns" style="align-items:baseline"><span class="big">${a+bonus}</span><span class="small dim">to hit · d20 [${a}${fm==="adv"||fm==="dis"?", "+b+" "+fm.toUpperCase():""}] ${sg(bonus)}${fm==="adv"||fm==="dis"?"":" · alt "+(b+bonus)}${a===20?' <span class="chip ok">CRIT</span>':a===1?' <span class="chip red">NAT 1</span>':""}</span></div>
  <div class="btns" style="align-items:baseline;margin-top:4px"><span class="big red">${d.total}</span><span class="small dim">${dt} · ${showParts(d)} · on a crit add ${crit.total} (${showParts(crit)})</span></div>${am?`<div class="small" style="margin-top:4px">${am}</div>`:""}</div>`;
 pushRoll(label,html,`<b>${a+bonus}</b> to hit, <b>${d.total}</b> ${dt}${a===20?" CRIT +"+crit.total:""}`);
 return html;
}
function resolveSave(label,dc,save,dmgExpr,dt,ocB,extra){
 if(PERSON()){ const ex=dmgExpr?String(dmgExpr).replace(/@int/g,M("int")):"";
  const lines=[`The target makes a <b>DC ${dc+ocB} ${save}</b> saving throw${ocB?" (includes Overclock +3)":""}.`];
  if(ex) lines.push(`Roll <b>${ex}${ocB?" + 3":""}</b> ${dt}: full damage on a fail, half on a success.`);
  if(extra) lines.push(`<span class="small muted">${extra}</span>`);
  pushRoll(label,"",`Target: DC <b>${dc+ocB}</b> ${save}${ex?`, you roll <b>${ex}${ocB?"+3":""}</b>`:""}`); return tellCard(label,ocB,lines); }
 const d=dmgExpr?roll(dmgExpr):null; const tot=d?d.total+ocB:0;
 const html=`<div class="rollcard"><div class="muted small">${esc(label)}${ocB?' <span class="chip red">Overclocked +3</span>':""}</div>
  <div class="btns" style="align-items:baseline"><span class="big">DC ${dc+ocB}</span><span class="small dim">${save} save</span></div>
  ${d?`<div class="btns" style="align-items:baseline;margin-top:4px"><span class="big red">${tot}</span><span class="small dim">${dt} on a fail · ${Math.floor(tot/2)} on a success · ${showParts(d)}${ocB?" +3":""}</span></div>`:""}
  ${extra?`<div class="small muted">${extra}</div>`:""}</div>`;
 pushRoll(label,html,`DC <b>${dc+ocB}</b> ${save}${d?`, <b>${tot}</b> ${dt} (half ${Math.floor(tot/2)})`:""}`);
 return html;
}
function useOption(id){
 const o=OPTS[id]; if(!o) return;
 const C=S.combat;
 if(C.on && !C.mine && (o.slot==="act"||o.slot==="bon")){ C.plan=C.plan||{act:null,bon:null,oc:false,note:""}; C.plan[o.slot]=id; pushRoll("Planned",``,`<b>${esc(o.n)}</b> for your next ${o.slot==="act"?"action":"bonus action"}`); save(); render(); return; }
 if(C.on && C.plan){ if(C.plan.act===id) C.plan.act=null; if(C.plan.bon===id) C.plan.bon=null; }
 if(o.dis){ toastModal(o.n, `<p class="muted">${esc(o.dis===true?"Not available right now.":o.dis)}</p>`); return; }
 const costly = ["discharge","rshield","spark","fuel","axeblind","mind","pipes"].includes(o.kind) || o.id==="gbolt" || (o.kind==="gadget" && BPK[S.loadout[o.gi].key].l>0);
 if(S.settings.confirmSpend && costly && UI.confirmed!==id){ modal(`<h2>Use ${esc(o.n)}?</h2><p class="muted">${o.cost?esc(o.cost)+" · ":""}${o.meta}</p><div class="btns" style="margin-top:10px"><button class="btn pri" data-act="useConfirm" data-k="${id}">Use it</button><button class="btn" data-act="close">Cancel</button></div>`); return; }
 UI.confirmed=null;
 if(o.kind==="gadget"){ const gb=BPK[S.loadout[o.gi].key], cc=concConflict(gb); if(cc && UI.concOk!==id){ concModal(gb,cc,`data-act="concOk" data-k="${id}"`); return; } }
 UI.concOk=null;
 let html="", slot=o.slot||"act";
 const ocB = (o.kind==="gadget"||o.kind==="discharge") ? ocApply() : 0;
 switch(o.kind){
  case "atk": html=resolveAttack(o.n,o.atk,o.dmg,o.dt,0,!["dagger","hammer","axe"].includes(id)); if(id==="gbolt"){S.lim.gbolt=0;logEv("Used Guiding Bolt");} break;
  case "scorch": if(PERSON()){ html=tellCard("Scorching Ray",0,[`Make <b>3 ray attacks</b>: roll <b>d20 ${sg(ATK())}</b> for each (one target or several).`,`Each ray that hits: <b>2d6</b> fire.`,`Then brace against the energy: <b>Con save, d20 ${sg(saveBonus("con"))}</b> (the DM sets the DC).`]); pushRoll("Scorching Ray","",`3 × d20 ${sg(ATK())}, 2d6 fire each, then Con save d20 ${sg(saveBonus("con"))}`); break; } else { let rays=[1,2,3].map(n=>{const a=R(20),d=roll("2d6");return `Ray ${n}: <b>${a+ATK()}</b> to hit (d20 ${a}${a===20?" CRIT":""}), <b>${d.total}</b> fire [${d.parts[0].rs}]`}).join("<br>"); const con=R(20)+saveBonus("con");
    html=`<div class="rollcard"><div class="muted small">Scorching Ray (arm)</div><div class="small">${rays}</div><div class="small" style="margin-top:6px">Con save to withstand it: <b>${con}</b> (DC set by the DM)</div></div>`; pushRoll("Scorching Ray",html,`3 rays, Con save ${con}`); break; }
  case "discharge": {
    setEnergy(S.energy-o.e,o.n);
    const iDC=8+PB()+M("int"), iA=PB()+M("int");
    if(id==="pbolt") html=resolveAttack(o.n,iA,"2d8","force",ocB);
    if(id==="pstream") html=resolveSave(o.n,iDC,"Dex","2d8","force",ocB,"30-ft by 5-ft line.");
    if(id==="cburst") html=resolveSave(o.n,iDC,"Str","2d8","force",ocB,"10-ft radius. Fail: pushed 10 ft from the centre.");
    if(id==="overload") html=resolveSave(o.n,iDC,"Str","6d8","force",ocB,"Fail: restrained until the end of your next turn; it repeats the save at the end of each of its turns.");
    break; }
  case "gadget": {
    const g=S.loadout[o.gi], b=BPK[g.key];
    html=deployGadget(o.gi, ocB); slot=SLOT(b.t); break; }
  case "pipes": S.ch.pipes--; logEv("Pipes of Haunting (charge used)"); html=resolveSave(o.n,15,"Wis",null,"",0,"Each (or only hostile) creature within 30 ft that can hear: frightened of you for 1 minute, repeating the save at the end of each of its turns."); break;
  case "fuel": fuelModal(); return;
  case "insight": insightModal(); spendEco(slot); save(); render(); return;
  case "vacuum": spendEco("rea"); save(); render(); soulModal(); return;
  case "rshield": S.ch.rshield--; logEv("Repulsion Shield push"); html=`<div class="rollcard"><div class="big">Pushed</div><div class="small muted">Attacker shoved up to 15 ft away. ${S.ch.rshield} charges left.</div></div>`; pushRoll(o.n,html,"attacker pushed 15 ft"); break;
  case "spark": if(PERSON()){ S.lim.spark=0; logEv("Guiding Spark"); html=tellCard("Guiding Spark",0,["Roll <b>1d4</b>. The creature subtracts it from its saving throw."]); pushRoll(o.n,"","Roll <b>1d4</b>, they subtract it"); break; } { S.lim.spark=0; const d=R(4); logEv("Guiding Spark"); html=`<div class="rollcard"><div class="muted small">Guiding Spark</div><div class="big ecto">−${d}</div><div class="small muted">to the creature's saving throw</div></div>`; pushRoll(o.n,html,`<b>−${d}</b> to their save`); break; }
  case "axeblind": S.ch.axe--; logEv("Battleaxe flare"); html=resolveSave(o.n,DC(),"Con",null,"",0,"Fail: blinded until the end of its next turn."); break;
  case "mind": S.ch.mind--; logEv("Mind Sharpener: concentration held"); html=`<div class="rollcard"><div class="big">Held</div><div class="small muted">Concentration save succeeds. ${S.ch.mind} charges left.</div></div>`; pushRoll(o.n,html,"concentration held"); break;
  case "axelight": S.axeLight=!S.axeLight; html=""; pushRoll(o.n,"",S.axeLight?"light on":"light off"); break;
  case "simple": html=""; pushRoll(o.n,"",o.meta); break;
 }
 spendEco(slot); save(); render();
 if(html) toastModal(o.n, (o.fl&&showFl()&&o.kind!=="gadget"?`<div class="flav" style="font-size:14px;margin-bottom:6px">${esc(o.fl)}</div>`:"")+html);
}
function deployGadget(i, ocB){
 const g=S.loadout[i], b=BPK[g.key]; if(!g||!b) return "";
 if(b.l>0){ g.dep=true; }
 if(b.conc){ if(S.conc && S.conc!==b.n) logEv(`Dropped concentration on ${S.conc}`); S.conc=b.n; }
 logEv(`Deployed ${b.c} (${b.n})${ocB?" overclocked":""}`);
 let html="";
 if(b.atk) html=resolveAttack(`${b.n}`,ATK(),b.dmg,b.dt,ocB,!["booming","gfb"].includes(b.k));
 else if(b.s) html=resolveSave(`${b.n}`,DC(),b.s,b.dmg||null,b.dt||"",ocB,"");
 else if(b.heal && PERSON()){ const ex=b.heal.replace("@int",M("int")), fl=flavOf(b);
  askRolls(b.c,(fl&&showFl()?`<div class="flav" style="font-size:14px">${esc(fl)}</div>`:"")+`<div class="tell">Roll <b>${ex}</b> for the hit points restored.</div><p class="small muted">${esc(b.fx)}</p>`,[{k:"h",label:`Total of ${ex}`},{k:"me",type:"flag",label:"The target is me (Flint)"}],
   v=>{ if(v.me){ heal(v.h); return `<div class="ectobox">You regain ${v.h} HP. HP ${S.hp.cur}/${maxHp()}.</div>`; } logEv(`${b.n}: ally regained ${v.h} HP`); return `<div class="ectobox">Your ally regains ${v.h} HP.</div>`; });
  return null; }
 else if(b.tmp && PERSON()){ const fl=flavOf(b);
  askRolls(b.c,(fl&&showFl()?`<div class="flav" style="font-size:14px">${esc(fl)}</div>`:"")+`<div class="tell">Roll <b>${b.tmp}</b> for temporary hit points.</div>`,[{k:"h",label:`Total of ${b.tmp}`}],
   v=>{ const had=S.hp.temp; if(v.h>S.hp.temp) S.hp.temp=v.h; logEv(`False Life: ${v.h} temp HP`); return `<div class="ectobox">${v.h>had?`You now have ${v.h} temporary HP.`:`You keep your ${had} temp HP (temp HP doesn't stack).`}</div>`; });
  return null; }
 else if(b.heal){ const h=roll(b.heal); html=`<div class="rollcard"><div class="muted small">${b.n}</div><div class="big" style="color:var(--heal)">${h.total}</div><div class="small dim">healed · ${showParts(h)}</div></div><div class="btns" style="margin-top:6px"><button class="btn ok sm" data-act="healMe" data-n="${h.total}">It was me: heal ${h.total}</button></div>`; pushRoll(b.n,html,`heals <b>${h.total}</b>`); }
 else if(b.tmp){ const h=roll(b.tmp); if(h.total>S.hp.temp){S.hp.temp=h.total;} logEv(`False Life: ${h.total} temp HP`); html=`<div class="rollcard"><div class="big ecto">${h.total}</div><div class="small dim">temp HP (applied if higher than current)</div></div>`; pushRoll(b.n,html,`<b>${h.total}</b> temp HP`); }
 else { html=`<div class="rollcard"><div class="muted small">Deployed</div><div class="big" style="font-size:22px">${esc(b.c)}</div></div>`; pushRoll(b.n,html,"deployed"); }
 const fl=flavOf(b);
 return (fl&&showFl()?`<div class="flav" style="font-size:14px;margin-bottom:6px">${esc(fl)}</div>`:"") + html + `<p class="small" style="margin-top:6px"><b>What happens:</b> ${esc(b.fx)}</p>` + (b.l>0?`<p class="small muted">This gadget is now used until your next short or long rest. <button class="btn sm" data-act="undoUse" data-i="${i}">Undo, tapped by mistake</button></p>`:"");
}
function dsResult(r){ let t; if(r===20){ S.hp.cur=1; S.ds={s:0,f:0}; t="Natural 20: back up with 1 HP!"; } else if(r===1){ S.ds.f=Math.min(3,S.ds.f+2); t="Natural 1: two failures."; } else if(r>=10){ S.ds.s=Math.min(3,S.ds.s+1); t="Success."; } else { S.ds.f=Math.min(3,S.ds.f+1); t="Failure."; }
 if(S.ds.s>=3) t+=" Stable."; if(S.ds.f>=3) t+=" Three failures."; pushRoll("Death save",``,`<b>${r}</b> ${t}`); logEv(`Death save ${r}: ${t}`); save(); render(); }
function askRolls(title, intro, fields, apply){
 UI.ask={title,fields,apply};
 modal(`<h2>${esc(title)}</h2>${intro||""}

function vacApply(row,total,rs,breach){
 const room=eMax()-S.energy; const cap=Math.min(room,total), excess=total-cap;
 setEnergy(S.energy+cap,"Soul Vacuum CR "+row[0]);
 let h=`<div class="rollcard"><div class="muted small">Captured from CR ${row[0]} · ${row[1]}${rs?` [${rs.join(", ")}]`:` = ${total}`}</div><div class="big ecto">+${cap}</div><div class="small dim">energy · pack now ${S.energy}/${eMax()}</div></div>`;
 if(excess>0) h+=`<div class="redbox"><b>Backlash: ${excess} necrotic.</b> It burns through you or an adjacent creature. <button class="btn sm red" data-act="backlash" data-n="${excess}">I take it</button></div>`;
 if(breach){ if(PERSON()){ h+=`<div class="redbox"><b>Containment Breach!</b> A die showed 4. Roll <b>d100</b> on the wild table.</div>`; logEv("Containment Breach"); } else { const w=R(100); h+=`<div class="redbox"><b>Containment Breach!</b> A die showed 4. Wild table d100: <b class="num">${w}</b></div>`; logEv(`Containment Breach, d100 ${w}`); } }
 pushRoll("Soul Vacuum",h,`+${cap} energy${excess?`, ${excess} backlash`:""}${breach?", BREACH":""}`); save(); render(); soulModal(h);
 if(breach && PERSON()){ askRolls("Containment Breach!",`<div class="redbox">A capture die showed a 4. The escaping spirit rebounds through the machinery.</div><div class="tell">Roll <b>d100</b> on the wild table.</div>${excess>0?`<p class="small muted">Backlash: ${excess} necrotic to you or an adjacent creature. Apply it from the HP panel if it's you.</p>`:""}`,[{k:"w",label:"Your d100 roll"}],v=>{ const w=Math.max(1,Math.min(100,v.w)); logEv(`Containment Breach, wild table d100 ${w}`); pushRoll("Wild table","",`d100 <b>${w}</b>`); return `<div class="redbox">Wild table result <b class="num">${w}</b>. Tell the DM what it is.</div>${excess>0?`<div class="btns"><button class="btn sm red" data-act="backlash" data-n="${excess}">I take the ${excess} necrotic backlash</button></div>`:""}`; }); }
}
function finishInv(cost,r,fIn){
  const name=(UI.wbName||"").trim()||"Unnamed device", tier=+(UI.wbTier||0), dc=TIERS[tier][1];
  let res, cls;
  if(r<=5){ const f=fIn!=null?fIn:(PERSON()?0:R(6)), dmg=Math.floor(f/2); if(f) damage(f,"fire",true); setStress(S.stress+1,"meltdown"); S.scrap=Math.max(0,S.scrap-cost); res=`<b>Catastrophic meltdown.</b> It turns to molten slag in your hands. ${cost} gp of materials destroyed. ${f?`You take ${dmg} fire (${f}, halved by resistance)`:`Roll 1d6 fire (halved by resistance) and take it on the HP panel`} and 1 Stress.`; cls="redbox"; }
  else if(r<dc){ res=`<b>Failure.</b> The blueprint doesn't work. Materials are fine, but your fixation on the broken device makes you ignore your physical limits (ask the DM).`; cls="warnbox"; }
  else {
   S.scrap=Math.max(0,S.scrap-cost);
   let snapped="";
   if(S.inventions.length>=invCap()){ const o=S.inventions.shift(); snapped=` Your oldest invention, <b>${esc(o.n)}</b>, violently snaps.`; logEv(`${o.n} snapped (over invention limit)`); }
   S.inventions.push({id:nid(),n:name,tier,note:(UI.wbNote||"")+(r>=95?" [Critical: minor bonus]":"")});
   res= r>=95?`<b>Critical success!</b> ${esc(name)} works flawlessly and gains a minor bonus (range, durability, or silent). ${cost} gp used.${snapped}`:`<b>Success.</b> ${esc(name)} works as planned. ${cost} gp used.${snapped}`; cls="ectobox";
   UI.wbName="";UI.wbNote="";
  }
  logEv(`Tinkered ${name} (T${tier}): d100 ${r}`);
  UI.wbResult=`<div class="${cls}">d100 <b class="num">${r}</b> vs ${dc}+ · ${res}</div>`;
  pushRoll("Invention",``,`d100 <b>${r}</b> vs ${dc}+`);
  save(); render(); closeModal();
}
