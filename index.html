<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barovia Campaign Chronicle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Barovia Campaign Chronicle</h1>
        <p>"I am the Ancient. I am the Land."</p>
    </header>

    <div class="tabs-container">
        <div class="tab-menu" id="tabMenu">
            <button class="tab-btn" onclick="loadFragment('overview', event)">Overview</button>
            <button class="tab-btn" onclick="loadFragment('players', event)">Companions</button>
            <button class="tab-btn" onclick="loadFragment('sessions', event)">Chronicles</button>
            <button class="tab-btn" onclick="loadFragment('timeline', event)">Timeline</button>
            <button class="tab-btn" onclick="loadFragment('npcs', event)">Denizens</button>
            <button class="tab-btn" onclick="loadFragment('quests', event)">Quests</button>
            <button class="tab-btn" onclick="loadFragment('battles', event)">Combat</button>
            <button class="tab-btn" onclick="loadFragment('lore', event)">Lore</button>
            <button class="tab-btn" onclick="loadFragment('codex', event)">Codex</button>
            <button class="tab-btn" onclick="loadFragment('locations', event)">Realm</button>
            <button class="tab-btn" onclick="loadFragment('map', event)">Map</button>
            <button class="tab-btn" onclick="loadFragment('tarokka', event)">Tarokka</button>
            <button class="tab-btn" onclick="loadFragment('library', event)">Library</button>
        </div>

        <div class="search-wrapper" style="padding: 15px;">
            <input type="text" id="liveSearch" class="search-bar" placeholder="Search current tab..." onkeyup="filterContent()">
        </div>

        <div id="content-area" class="tab-content active" style="display: block;"></div>
    </div>

    <script>
        // Loads a tab's HTML fragment into #content-area, re-running any
        // <script> tags the fragment contains (e.g. map.html's own logic).
        async function loadFragment(filename, event) {
            const response = await fetch(`content/${filename}.html`);
            const html = await response.text();

            document.getElementById('content-area').innerHTML = html;

            document.querySelectorAll('#content-area script').forEach(oldScript => {
                const newScript = document.createElement('script');
                newScript.textContent = oldScript.textContent;
                document.body.appendChild(newScript);
                oldScript.remove();
            });

            // Map pin <button>s default to type="submit" inside forms; force them inert.
            document.querySelectorAll('.map-pin').forEach(btn => {
                btn.setAttribute('type', 'button');
            });

            document.getElementById('liveSearch').value = '';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Live-filters cards/rows in the current tab by search text.
        function filterContent() {
            const input = document.getElementById('liveSearch').value.toLowerCase();
            const items = document.querySelectorAll('#content-area .card, #content-area tr');

            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(input) ? '' : 'none';
            });
        }

        // Load the first tab on page load.
        window.onload = () => {
            document.querySelector('.tab-btn').click();
        };
    </script>
</body>
</html>
