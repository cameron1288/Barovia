 dtSet:d=>{ const D=UI.dt; if(d.k==="f"){ D.f=+d.v; if(D.f!==20) D.mode="norm"; } if(d.k==="n") D.n=Math.max(1,Math.min(20,D.n+(+d.v))); if(d.k==="mod") D.mod=Math.max(-20,Math.min(30,D.mod+(+d.v))); if(d.k==="mode"){ D.mode=d.v; if(d.v!=="norm"){ D.f=20; D.n=1; } } diceModal(); },
 dtRoll:()=>{ const D=UI.dt; let rs=[], kept, total, desc;
  if(D.f===20 && D.mode!=="norm"){ const a=R(20), b=R(20); kept=D.mode==="adv"?Math.max(a,b):Math.min(a,b); rs=[a,b]; total=kept+D.mod; desc=`d20 ${D.mode==="adv"?"advantage":"disadvantage"} [${a}, ${b}] keep ${kept}${D.mod?" "+sg(D.mod):""}`; }
  else { for(let i=0;i<D.n;i++) rs.push(R(D.f)); total=rs.reduce((x,y)=>x+y,0)+D.mod; desc=`${D.n}d${D.f} [${rs.join(", ")}]${D.mod?" "+sg(D.mod):""}`; }
  UI.dtLast=`<div class="rollcard"><div class="big">${total}</div><div class="small dim">${desc}</div></div>`; pushRoll("Dice","",`<b>${total}</b> <span class="dim">${desc}</span>`); save(); diceModal(); },

 modBuild:d=>{ const m=S.mods[d.k]; if(!m.built && modsUsed()>=modCap()){ toastModal("All slots used",`<p>You can keep ${modCap()} modifications built at level ${B().level}. Unbuild one first.</p>`); return; } m.built=!m.built; logEv(`${INFK[d.k].n} ${m.built?"built":"dismantled"}`); if(m.built&&m.holder==="flint") ensureInfItem(d.k); save(); render(); },
 modHolder:d=>{ const m=S.mods[d.k]; if(m.holder===d.v) return; m.holder=d.v; if(d.v==="ally"){ const i=S.items.findIndex(x=>x.fx===d.k); if(i>=0){ logEv(`${S.items[i].n} handed to an ally`); S.items.splice(i,1); } } else ensureInfItem(d.k); save(); render(); },
 concOk:d=>{ closeModal(); if(d.k){ UI.concOk=d.k; UI.confirmed=d.k; useOption(d.k); } else { UI.concOkI=d.i; ACT.deploy({i:d.i}); } },
 speedInfo:()=>{ const sp=speedParts(), c=S.cond||{};
  const rows=sp.rows.map((r,i)=>[esc(r[0]), i===0?String(r[1])+" ft":(r[1]>=0?"+":"")+r[1]+" ft"]);
  if(sp.zero) rows.push([`<span style="color:#ffb3a8">${esc(sp.zero)}: speed 0</span>`,"0 ft"]);
  const notes=[];
  if(c.Prone) notes.push("Prone: crawling costs double, and standing up takes half your speed.");
  if(S.conc==="Expeditious Retreat") notes.push("Expeditious Retreat: you can Dash as a bonus action.");
  if(fxOn("boots")) notes.push("Boots of the Winding Path: bonus action teleport up to 15 ft to a space you occupied this turn.");
  notes.push("Breastplate is medium armour with no Strength requirement, so it doesn't slow you.");
  notes.push("Dash doubles your movement for the turn.");
  infoPop("Speed", `<div class="what">${sp.total} ft</div>${calcTable([...rows,[`<b>Speed</b>`,`<b>${sp.total} ft</b>`]])}<ul class="muted">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`); },

 featInfo:d=>{ const k=d.k;
  const T={
   gbolt:["Guiding Bolt · Fractured Genius",`<p>Once per long rest, without using a gadget or any resources. Uses INT.</p><p><b>Ranged spell attack</b>, 120 ft, ${sg(ATK())} to hit. <b>Hit:</b> 4d8 radiant. The next attack roll against the target before the end of your next turn has advantage.</p><p class="small muted">Natural 20: ${critDmg("4d8")} radiant (max + proficiency). Status: ${S.lim.gbolt?"ready":"used until a long rest"}.</p>`],
   spark:["Guiding Spark · Spirit Engine",`<p><b>Reaction</b>, once per short or long rest. When a creature you can see within 60 ft makes a saving throw against one of your Blueprints or Ectoplasmic Discharges, you interfere with the link between its body and soul.</p><p>The creature <b>subtracts 1d4</b> from that saving throw.</p><p class="small muted">Status: ${S.lim.spark?"ready":"used until a rest"}.</p>`],

 traitInfo:d=>{ const T={
   vision:["Gloomvision","<p>Darkvision out to 60 ft: dim light counts as bright and darkness as dim, in shades of grey.</p><p>Your eyes also cut straight through the Barovian mists, so you see clearly where others are blinded by them.</p><p class='small muted'>Amber-Veined Gnome trait; replaces your old darkvision.</p>"],
   resist:["Fire resistance","<p>You take half damage from fire (rounded down). The app halves fire damage automatically when you choose fire on the HP keypad, and for an invention meltdown.</p><p class='small muted'>Amber-Veined Gnome trait.</p>"],
   saves:["Saving throw traits",`<ul><li><b>Disadvantage on Wisdom saves</b> (Amber-Veined transformation).</li><li><b>Advantage on Sanity/Composure saves</b> (Grave Resilience).</li><li>Proficient in <b>Constitution</b> (${sg(saveBonus("con"))}) and <b>Intelligence</b> (${sg(saveBonus("int"))}) saves.</li></ul><p class='small muted'>The roll pop-up applies these for you.</p>`],

  }; const t=T[d.k]; if(t) infoPop(t[0],t[1]); },

  <ul><li><b>Capacity:</b> 5 + INT mod = ${eMax()}.</li><li><b>Gain it:</b> Soul Vacuum (reaction when a hostile CR ¼+ creature dies within 30 ft), or Seriach's Fuel at 0 energy.</li><li><b>Spend it:</b> Proton Bolt 1, Proton Stream 3, Containment Burst 4, Full Proton Overload 5.</li><li><b>Over capacity:</b> excess from Soul Vacuum burns through as 1 necrotic per point to you or an adjacent creature.</li><li><b>Long rest:</b> lose half (rounded up) unless you take 1 Stress to keep it all.</li></ul>`),

 bpInfo:d=>{ const b=BPK[d.k]; if(!b) return; infoPop(`${b.c} · ${b.n}`, usePanel(USE[b.k],USE_OC[b.k])); },
 undo:()=>{ const u=UNDO.pop(); if(!u){ updateUndo(); return; } const rolls=S.rolls; S=merge(DEF(),JSON.parse(u.s)); S.rolls=rolls; logEv(`Undid: ${u.label}`); save(); closeModal(); render(); updateUndo(); pushRoll("Undo","",`Undid <b>${esc(u.label)}</b>`); },
 concHeld:d=>{ logEv(`Kept concentration on ${S.conc} (DC ${d.dc})`); save(); render(); closeModal(); },

 syncNow:()=>{ syncPull().then(()=>syncPush()); },
 syncDisconnect:()=>{ SY.token=""; SY.gist=""; SY.base=SY.synced=0; saveSync(); syncStatus("off"); settingsModal(); pushRoll("Sync","","This device stopped syncing. Its Flint stays as it is."); },

const UNDO=[];
const snapOf = () => JSON.stringify(S,(k,v)=>(k==="rolls"||k==="_t"||k==="lastAutoBackup")?undefined:v);
const UNDO_LABEL={energy:"energy change",stress:"Stress change",lim:"feature use",chg:"charge use",eco:"action economy",exh:"exhaustion change",insp:"Inspiration",iq:"item quantity",iworn:"equip/unequip",research:"research",build:"gadget built",moveK:"load-out order",setTog:"setting",setVal:"setting",setTogQ:"setting",ds:"death save",armor:"armour",shieldT:"shield",overclock:"Overclock",planOc:"plan",planDel:"plan",planClear:"plan",lrOpt:"rest option",lrDone:"rest checklist",lrLen:"rest length",scrapAdj:"scrap"};
function updateUndo(){ const b=document.getElementById("undoBtn"); if(!b) return; const u=UNDO[UNDO.length-1]; b.hidden=!u; if(u) b.textContent="Undo: "+(u.label.length>28?u.label.slice(0,27)+"…":u.label); }
document.addEventListener("click",e=>{ const t=e.target.closest("[data-act]"); if(!t) return; const act=t.dataset.act, fn=ACT[act]; if(!fn) return; if(act==="save") e.stopPropagation();
 const before = act==="undo" ? null : snapOf(), top=S.log[0];
 fn(t.dataset,t,e);
 if(before!==null){ const after=snapOf(); if(after!==before){ UNDO.push({s:before,label:(S.log[0]&&S.log[0]!==top)?S.log[0].txt:(UNDO_LABEL[act]||"last change")}); if(UNDO.length>25) UNDO.shift(); updateUndo(); } } });
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.bind){ const path=t.dataset.bind.split("."); let o=S; for(let i=0;i<path.length-1;i++) o=o[path[i]]; const v=t.type==="number"?(+t.value||0):t.value; o[path.at(-1)]=v; if(path[0]==="base"&&path[1]==="maxHp") S.hp.cur=Math.min(S.hp.cur,maxHp()); save(); render(); }
