<style>
/* Layout: a fixed gauge cluster (vitals + ability strip) above tabbed work panels, sized for a landscape tablet. Iron-and-ash ground, amber veins for Flint, violet for ectoplasm. */
:root{
  --soot:#14120f; --iron:#1d1a16; --iron2:#26221c; --iron3:#312c25; --line:#3d362c;
  --ash:#ebe4d6; --ash2:#b4aa97; --ash3:#7f7667;
  --amber:#f2a83b; --amber2:#9a6420; --amberglow:rgba(242,168,59,.14);
  --ecto:#b28cff; --ecto2:#5e3fa6; --ectoglow:rgba(178,140,255,.16);
  --blood:#e8604f; --heal:#63c49e; --warn:#e9c75a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--soot);color:var(--ash);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ash);background:var(--soot);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.45}
input[type=number]{width:72px;font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* ---------- gauge cluster ---------- */
.top{z-index:20;background:var(--soot);border-bottom:1px solid var(--line);padding-block:10px 8px}
.row1{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap}
.ident{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1 1 110px}
.ident h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:.5px;text-transform:uppercase}
.ident h1 span{color:var(--amber)}
.ident small{color:var(--ash2);font-size:13px}
.gauge{background:var(--iron);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:64px;text-align:center}
.gauge .lab{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ash2);font-weight:600}
.gauge .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.05}
.gauge.tap{cursor:pointer}
.gauge.tap:active{background:var(--iron2)}
.hp{flex:0 1 210px;align-items:stretch;cursor:pointer}
.hp .hpline{display:flex;align-items:baseline;gap:6px;justify-content:center}
.hp .val{font-size:32px}
.hp .max{color:var(--ash2);font-family:var(--f-mono);font-size:14px}
.hp .max,.hp .tmp{white-space:nowrap}
.hpx{font-size:11px;color:var(--heal);font-family:var(--f-mono);text-align:center;white-space:nowrap;margin-top:-2px}
.hp .tmp{color:var(--ecto);font-family:var(--f-mono);font-size:14px;font-weight:600}
.bar{height:6px;background:var(--iron3);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--heal);transition:width .25s}
.bar i.low{background:var(--warn)} .bar i.crit{background:var(--blood)}
.ac .val{color:var(--amber)}
.ac .sub{font-size:10.5px;color:var(--ash2)}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.pip{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ecto2);background:transparent}
.pip.on{background:var(--ecto);border-color:var(--ecto);box-shadow:0 0 6px var(--ecto)}
.pip.st{border-color:#7a3a33}.pip.st.on{background:var(--blood);border-color:var(--blood);box-shadow:0 0 6px var(--blood)}
.energy{min-width:128px}.energy .val{color:var(--ecto)}
.stress .val{color:var(--blood)}
.ctl{display:flex;gap:4px;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--iron2);border-radius:5px;padding:1px 9px;font-weight:700;font-size:15px;line-height:1.3}
.mini:active{background:var(--iron3)}
.combatsw{flex:0 0 auto;min-width:86px;border:1.5px solid var(--line);background:var(--iron);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 10px}
.combatsw .sw{width:52px;height:28px;border-radius:14px;background:var(--iron3);position:relative;transition:background .2s}
.combatsw .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ash2);transition:left .2s,background .2s}
.combatsw.on{border-color:var(--blood);background:rgba(232,96,79,.1)}
.combatsw.on .sw{background:var(--blood)}
.combatsw.on .sw::after{left:27px;background:#fff}
.combatsw .lab{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}

.abil{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
body{display:flex;flex-direction:column;overflow:hidden}
.top{flex:none}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:100%;padding-bottom:70px}
#main.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:58px}
#main.fill > .grid{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr)}
#main.fill > .grid > .panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#main.fill .scrollbox{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
@media (max-width:680px){#main.fill{display:block;overflow-y:auto;padding-bottom:70px}#main.fill > .grid > .panel{overflow:visible}#main.fill .scrollbox{overflow:visible}}
.ab{background:var(--iron);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px 6px;text-align:center;position:relative;cursor:pointer}
.ab:active{background:var(--iron2)}
.ab .k{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--ash2)}
.ab .m{font-family:var(--f-display);font-size:23px;font-weight:700;line-height:1}
.ab .s{font-family:var(--f-mono);font-size:12px;color:var(--ash3)}

o anyone else."}, "Poison Spray": {"c": "The Sulfur-Gas Diffuser", "d": "You slam your heel down, venting an auxiliary exhaust pipe at your hip. A thick, choking cloud of highly toxic, greenish-yellow sulfurous gas billows outward in a brief, pressurized jet directly into the face of a nearby foe."}, "Prestidigitation": {"c": "The Multi-Utility Toolkit", "d": "You utilize an array of hidden micro-gadgets built into your sleeves. You use a microscopic blowtorch to heat food, a miniature static-collector to spark a candle, a chemical aerosol to spray a foul odor, or a mechanical stamp to print a temporary mark."}, "Ray of Frost": {"c": "The Compressed Cryo-Beam", "d": "You over-pressurize your pack’s coolant loop, firing a continuous, blinding stream of super-chilled chemical vapor from your Emitter. The beam rapidly calcifies the target's joints, coating them in a layer of heavy, movement-slowing ice."}, "Resistance": {"c": "The Bio-Static Regulator", "d": "You slap a small adhesive patch onto an ally’s skin. The internal copper needle injects a micro-dose of an adrenaline-stabilizing serum, hardening their physical nervous system against sudden shocks, poisons, or mental intrusions."}, "Shocking Grasp": {"c": "The High-Voltage Tesla Gauntlet", "d": "You slam a heavy capacitor switch, charging your copper-reinforced glove with a massive, crackling electrical current. When you touch an enemy, the sudden discharge violently disrupts their nervous system, completely freezing their reflexes."}, "Spare the Dying": {"c": "The Defibrillator Paddles", "d": "You tear open a hatch on your pack and slam two zinc plates onto a dying creature's chest. With a loud, mechanical whir-click, the pack discharges a precisely regulated electrical shock straight into their heart, instantly stabilizing their vital signs."}, "Sword Burst": {"c": "The Centrifugal Blade Ring", "d": "You stomp a pressure-plate on your boot, releasing a ring of spring-loaded, razor-sharp clockwork sawblades from your belt. The blades spin violently outward in a 5-foot radius on extended copper arms before snapping back into their housings."}, "Thorn Whip": {"c": "The Steel-Cable Winch", "d": "You fire a barbed, segmented steel cable from your forearm gauntlet. The barbed teeth dig into the enemy, and a high-speed internal gear winch instantly clicks into reverse, violently dragging the target up to 10 feet closer to your position."}, "Thunderclap": {"c": "The Sonic Percussion Blast", "d": "You forcefully slam your heavy mechanical gauntlets together. An explosive percussion cap built into the palms detonates, unleashing a deafening, localized shockwave of acoustic pressure that rattles the teeth of everyone standing near you."}, "Absorb Elements": {"c": "The Thermal Grid Dissipator", "d": "When hit by elemental energy, you slam a lever on your forearm gauntlet. An auxiliary intake grid on your pack vents a blast of cooling gas, catching the incoming shockwave and storing the kinetic friction as pressurized heat to fuel your next melee strike."}, "Alarm": {"c": "The Tripwire Bell Sentry", "d": "You spend a minute stringing out ultra-fine, almost invisible steel hair-wires across a doorframe or camp perimeter, anchoring them to a highly sensitive clockwork bell housing. If a wire is brushed, an internal spring tensioner snaps, letting loose a frantic mechanical alarm."}, "Arcane Weapon": {"c": "The Core Elemental Injector", "d": "You slap a modular chemical cylinder onto your weapon's chamber. By turning a selector dial, you route pressurized tubes of acid, cold, fire, lightning, or poison along the blade or barrel, constantly bathing your strikes in volatile chemical coating."}, "Catapult": {"c": "The Pneumatic Rail-Sling", "d": "You point an over-cranked magnetic cylinder at a nearby object. With a violent hiss of compressed air, the high-pressure pneumatic piston generates massive kinetic force, violently launching the object forward like an invisible cannonball."}, "Cure Wounds": {"c": "The Pneumatic Stabilizing Syringe", "d": "You slam a heavy brass gun syringe into an ally's flesh. The spring-loaded needle violently injects a precisely measured dose of a highly concentrated, coagulating adrenaline cocktail that instantly seals ruptured flesh and stops internal bleeding."}, "Detect Magic": {"c": "The Ultraviolet Radiation Lens", "d": "You click a series of multi-layered amber and violet lenses down over your goggles. You manually calibrate the focus wheel, filtering out normal light spectrums to reveal the ambient humming radiation and heat signatures left behind by active arcane matrixes."}, "Disguise Self": {"c": "The Light-Refraction Shimmer Mesh", "d": "You attach a network of tiny copper pins to your coat and collar. When activated, the modules emit a localized, light-bending camouflage field that forms a pixelated, slightly flickering static illusion around your physical silhouette, masking your clothes and height."}, "Expeditious Retreat": {"c": "The Hydraulic Knee-Brace Overclock", "d": "You engage a high-pressure pump on your thighs, locking your legs into a pair of heavy pneumatic exoskeleton frames. The continuous, rapid pumping of the pistons forces your dead legs into a frantic, high-speed mechanical sprint."}, "Faerie Fire": {"c": "The Phosphorus Flareshot", "d": "You launch a small, pressure-fused glass canister into the air over the target area. The casing shatters with a loud crack, showering everything in a 20-foot cube with a sticky, glowing mist of highly luminescent amber phosphorus that cannot be easily wiped off."}, "False Life": {"c": "The Adrenaline Coagulant Pump", "d": "You activate a slow-release medical tube stitched into your coat. A cocktail of chemical stimulants and artificial numbing agents floods your unliving system, dulling your pain receptors and giving your dead flesh a surge of temporary physical durability."}, "Feather Fall": {"c": "The Compressed Air Drag-Chute", "d": "As you or an ally plunge downward, you trigger an explosive percussion cap on your belt. A blast of highly compressed carbon dioxide vents violently upward, creating a continuous column of pocketed air resistance that slows the descent to a safe, steady glide."}, "Grease": {"c": "The Lard-Aerosol Canister", "d": "You roll a pressurized iron canister across the floor. When it strikes the target point, the nozzle shears off, spraying a wide, thick sheet of super-slick, non-flammable tallow oil that instantly turns a 10-foot square of stone into a treacherous hazard."}, "Identify": {"c": "The Occult Diagnostic Matrix", "d": "You spend a minute clamping a magic item or relic into a heavy brass frame wired to your pack. You flip diagnostic toggles, tracking how the object reacts to electrical currents, magnetic fields, and lens magnification to mathematically deduce its features."}, "Jump": {"c": "The Pneumatic Boot Springs", "d": "You lock two massive, tightly wound steel coils onto the soles of an ally's boots. When they bend their knees, a mechanical trigger releases the tension, yanking the spring straight down and launching the wearer into a massive, calculated leap."}, "Longstrider": {"c": "The Kinetic Ankle-Tensioners", "d": "You wrap spring-loaded leather tension bands tightly around an ally's calves and ankles. The clockwork gears inside the straps store the kinetic energy of each step they take and release it on the upswing, naturally lengthening their stride and boosting speed."}, "Purify Food and Drink": {"c": "The Centrifugal Chemical Filter", "d": "You drop a miniature, hand-cranked brass filter unit into a container of liquid or pass a specialized UV-light rod over a plate of food. The device rapidly extracts or burns away toxins, sulfur, and rot, rendering the substance completely sterile."}, "Sanctuary": {"c": "The High-Frequency Sensory Scrambler", "d": "You activate a small, ticking brass module on an ally's belt. The gadget continuously broadcasts a discordant, high-frequency acoustic whine and a jarring strobe light that violently disrupts the target-acquisition senses of any monster trying to attack them."}, "Snare": {"c": "The Spring-Loaded Steel Winch", "d": "You spend a minute burying a heavy, spring-loaded iron clamping winch in the dirt and camouflaging it with mud and leaves. When a creature steps on the hidden trigger plate, the internal clockwork snaps shut, firing a corded wire loop up around its leg to hoist it into the air."}, "Tasha's Caustic Brew": {"c": "The Vitriol Firehose", "d": "You point a thick copper nozzle attached to a glass chemical tank on your hip. When you pull the primary lever, the pack violently pumps out a stream of thick, bubbling, greenish-black acid that shoots down a 30-foot line, melting anything it clings to."}, "Aid": {"c": "The Multi-Injecting Bio-Strayer", "d": "You throw a centralized chemical distributor onto the ground. The machine clicks loudly, firing up to three auto-targeting misting needles that punch into your allies' gear, injecting a timed-release combat steroid that artificially bolsters their physical resilience and pain thresholds."}, "Air Bubble": {"c": "The Brass Respirator Dome", "d": "You clamp a specialized, non-magical ventilation collar around a creature’s neck. A compact, humming oxygen-scrubbing canister on the device filters out moisture and toxic miasma, generating a localized field of clean, highly pressurized, breathable air around their head."}, "Alter Self": {"c": "The Biomechanical Flesh-Warp Harness", "d": "You lock an adjustable leather-and-iron harness tightly around your torso. By pulling heavy mechanical cords, the device uses internal hydraulic clamps and under-skin needles to painfully physically stretch your vocal cords, deploy clockwork gill-vents at your neck, or mechanically extend hidden metal claws from your gauntlets."}, "Arcane Lock": {"c": "The High-Voltage Magnetic Deadbolt", "d": "You bolt an experimental, heavy iron magnetic casing directly eached, the mechanical mouth springs open to blast the recording."}, "Magic Weapon": {"c": "The Kinetic Balancing Calibration", "d": "You use your tinker's tools to rapidly adjust a weapon's weight distribution, clamp an advanced, high-friction sharpening guide onto the blade, or add a counter-weight recoil guide to the hilt, physically maximizing its accuracy and lethal impact."}, "Protection from Poison": {"c": "The Inoculation Filter Patch", "d": "You apply an adhesive, needle-lined chemical patch directly over a creature’s main artery. The device slowly and continuously filters their blood through a charcoal-based mesh while pumping in a steady stream of defensive counter-agents that neutralize toxic substances."}, "Pyrotechnics": {"c": "The Magnesium Flash Canister", "d": "You throw a specialized, highly unstable chemical explosive directly into an active fire source. The moment the fuse touches the flame, the canister ruptures, completely consuming the fuel to create either a blinding, high-intensity magnesium flash or a massive, billowing cloud of choking black soot."}, "Rope Trick": {"c": "The Spatial-Phase Winch Hook", "d": "You launch a heavy brass winch block straight up into the air. When it reaches its apex, it deploys a localized, high-frequency electromagnetic field that locks the hook onto a stable, unseen gravitational fold in space. A 60-foot rope drops down, allowing allies to climb up into a cloaked, suspended platform."}, "See Invisibility": {"c": "The Quantum-Phase Filter Goggles", "d": "You use a small wrench to shift a secondary, multi-layered crystalline lens down over your eyes. This lens filters out the standard light spectrum, allowing you to clearly track the unique electromagnetic heat signatures and spatial distortions left behind by invisible or ethereal entities."}, "Skywrite": {"c": "The Pressurized Vapor Mortar", "d": "You launch a heavy, copper-finned chemical missile directly into the upper atmosphere. At its peak, the shell detonates, venting a highly concentrated, slow-dissipating chemical vapor that expands to form precise, dark soot letters against the sky, visible for miles."}, "Spider Climb": {"c": "The Micro-Hook Gauntlets & Soles", "d": "You equip a target with specialized, heavy leather gloves and boots lined with thousands of microscopic, spring-loaded steel hooks and pressurized suction cups. The pneumatic assist pumps click with every step, allowing them to scale walls and hang from ceilings."}, "Vortex Warp": {"c": "The Spatial Displacement Projector", "d": "You lock onto a creature with your main Emitter barrel and charge your pack's massive central capacitor. When you pull the primary lever, a blinding, high-voltage arc-flash violently collapses the spatial coordinates around the target, yanking them through an envelope of raw compression to snap-rebuild them at a different point within 90 feet."}, "Web": {"c": "The Pressurized Liquid-Latex Mortar", "d": "You shoulder a multi-barreled canister launcher and fire a heavy steel shell at a point within 60 feet. The canister explodes on impact, violently spraying a massive, rapidly expanding web of sticky, fast-hardening liquid latex fibers that glues creatures to the floor and walls."}};

const USE = {
 acid:["I snap the Corrosive Atomizer onto my wrist gauntlet until it locks with a click, then twist the pressure valve fully open. When I squeeze, a fine green mist hisses out in a cone across them. Where it settles, leather blisters, metal pits and skin starts to smoke.","I seat the atomizer on the gauntlet and dial the valve down until it barely turns. I hold my wrist steady over the spot and let a single drop fall. It hisses on contact and a thin curl of acrid smoke rises while it eats in."],
 booming:["I pull the tuning fork from my belt and strike it hard against the hilt of my weapon. The blade starts to hum, so low you feel it in your teeth more than hear it, and the air around the edge ripples. I step in and swing with it still ringing, and on impact the sound wraps around them and stays there.","I strike the fork against the blade and hold the weapon up in front of me. The hum fills the room and makes loose things on the table rattle. It slowly fades as I lower it and put the fork back on my belt."],
 bonfire:["I pull a thermite capsule from the rig, wind the spring fuse a full turn with my thumb and throw it. It rattles across the floor and the gears grind for a second. Then the casing splits and a column of white-hot chemical fire roars up, venting heat in every direction.","I wind a capsule, set it down carefully in the fire pit and step back. It ticks for a moment, then cracks open, and a hard white flame catches. It burns on its own, hot and steady, with no wood needed."],
 dlights:["I flip open the hatch on the side of my pack and spin the dial on my forearm. Four little brass fireflies climb out on spinning copper rotors, each glowing a harsh chemical green. With a twist of the dial they scatter across the room, lighting whatever I point them at.","I let the drones out one at a time and spin them up on the dial. They hover in a loose cluster in front of me, then I walk them slowly down the corridor ahead of us. Their green light bobs along the walls and floor, showing what's coming before we get there."],
 firebolt:["I take a magnesium slug from the feed on my sleeve and slot it into the rail along my forearm. I close the circuit with my thumb and the coils snap tight with a sharp electrical crack. The slug leaves the rail white-hot, burning a bright line through the air before it hits.","I load a slug and close the circuit slowly, letting the coils hum while I line it up. When I fire, it streaks across the room and lands in the kindling. The wood goes up in one bright, sputtering flash and catches."],
 frostbite:["I unclip the condenser tube from my belt, point it at them and crank the release wheel half a turn. A hiss, then a blast of freezing white vapour rolls over them. Frost races across their skin and armour, and you can see them stiffen as the cold sets into their joints.","I crack the release wheel a quarter turn and a thin plume of frost curls out of the tube. Everything it touches turns white and brittle, and the air around us drops sharply in temperature. I close the wheel and the frost slowly starts to melt."],
 gfb:["I pump the trigger in the grip twice and the edge of the blade comes away slick and shining with sulfur oil. The moment it strikes, the impact throws a spark and the oil ignites. Sheets of green chemical fire burst off the steel and leap onto whoever is standing next to them.","I pump a little oil onto the blade and strike the edge against a stone. Green flame runs the length of the steel with a soft whoosh, lighting the room an eerie colour. It burns for a moment, then gutters and dies."],
 guidance:["I reach over and slap the wire clip onto your ear. A small goggle on an arm flicks down in front of your eye, and the module starts pinging. It runs a quick calculation and lines of light trace out the weak points: where to grab, where to push, where it will give.","Before you start, I clip the module onto your ear and take a moment to calibrate it. It emits a high-frequency pulse you feel more than hear, then the goggle lowers into place. A small calculation runs across the lens, and the weak spots and structural points light up."],
 light:["I pop the cover on the Radium Core Clasp and snap it onto them, or onto whatever I'm holding. A hard, unnatural glow pours out of it, bright enough that shadows jump back across the room. Anyone wearing it can't hide.","I clip the radium clasp to my collar and thumb the cover open. A steady pale glow spreads out around me, lighting the room in a wide circle. When I close the cover, the light cuts out instantly."],
 llure:["I aim the Harpoon Coil Magnet and fire. The magnetic head slams onto them, the coil whines as it charges, and the cable snaps taut. Then it drags them across the floor toward me, crackling with current that jumps into them when they get close.","I fire the harpoon into the far wall to test the coil. The head clangs onto the stone and holds, the cable humming tight. I hit the release and it reels back in with a heavy clunk."],
 magehand:["I unfold the Pneumatic Grapple Rotor from my rig and send it up with a hiss. It hovers over the room on spinning rotors, its claw opening and closing. I work it with the controls on my forearm, sending it across to grab, open or pull whatever I need.","I launch the rotor and steer it over carefully, watching it rather than my hands. The claw lowers, opens and closes around the object on my cue, then lifts it away. It hovers back and sets it down where I want it, so I never have to touch it myself."],
 mstone:["I pull out the Kinetic Impact Loader and drop three pebbles into the chamber. I crank the handle once, the mechanism clunks, and the stones roll out humming with stored force. I hand them off or keep one ready to throw.","I load three stones into the chamber and give the handle a slow, full crank. The loader clunks and whines as it packs them with force. I pass them out one at a time. They're warm and buzz faintly in your hand."],
 mending:["Welding a break takes a full minute of steady work. In a fight, that's me crouched over the broken piece with the blowtorch going while everything happens around me.","I lay the broken pieces side by side and press them together. I spark up the arc-welding blowtorch, and blue light floods the area as I run a slow, careful bead along the seam. When I lift the torch away and let it cool, the break is gone."],
 message:["I pull the transceiver mic up to my mouth and point the antenna at you. You hear my voice in your ear, low and a little raspy through a crackle of static. Nobody else hears a thing, and you can whisper back the same way.","I tune the transceiver, turning the dial until the static drops to a low hiss. I aim the antenna down the hall and whisper. A moment later, a faint crackle comes back through the speaker with your answer."],
 pspray:["I uncork the Sulfur-Gas Diffuser, step in close and open the nozzle right in their face. A thick yellow cloud billows out with a hiss. They choke and stagger as it fills their lungs, and the stench of sulfur rolls over all of us.","I open the diffuser just a crack. A thin wisp of yellow gas curls out of the nozzle and hangs in the air. The smell of rotten eggs fills the room, and I close it again before it spreads."],
 presti:["I pop the multi-tool from my belt and flick it to the sparker head. A sharp crack and a burst of bright sparks go off right behind them, loud enough to make anyone turn.","I click through the heads on the multi-tool, each one locking in with a small snap. A puff of air dusts off a page, a warm glow heats a cold meal, a brush head cleans the mud off a boot. Small, quick tricks, all with the same little tool."],
 rfrost:["I level the Compressed Cryo-Beam and pull the trigger. A pale blue beam lances out with a sharp hiss and hits them square. Frost spreads up their legs and locks them up, and you can see them struggle to move.","I fire a short burst from the cryo-beam at the ground. A sheet of ice spreads out from where it hits, crackling as it forms. The cold hangs in the air afterwards, and our breath fogs."],
 resist:["I press the Bio-Static Regulator against your skin and flick the switch. A faint static hum runs over your body, raising the hair on your arms. It settles into a thin protective charge around you.","Before we go in, I fit the regulator on you and take a moment to dial it in. You feel the hum spread across your skin, then settle into something steady. It stays with you, a faint buzz just at the edge of feeling."],
 sgrasp:["I clench my fist inside the Tesla gauntlet and the coils start to whine as they charge. Blue arcs crawl between the copper rings. When I slap them, a crack of lightning jumps from the gauntlet across their whole body and they lock up for a moment.","I clench the gauntlet and let it charge. Blue arcs crawl and snap between the coils, lighting up my hand and throwing flickering shadows on the walls. When I open my fist, the charge bleeds off with a fading crackle."],
 spare:["I drop to my knees beside you, pull out the defibrillator paddles and charge them with a rising whine. I press them to your chest and fire. There's a hard thump, your body jerks, and you're breathing again.","I kneel beside them and charge the paddles, waiting for the whine to peak. I press them down and fire. A hard thump and a jolt, and then they settle, still out but holding on."],
 sburst:["I hit the release on the Centrifugal Blade Ring at my waist. It snaps open and starts to spin, blades whirling out in a tight circle around me with a rising shriek. Anyone standing close is caught in the edges.","I give the blade ring a short test spin. It whirs up with a metallic hiss, the blades a blur around my waist. Then it slows and folds back into itself with a click."],
 twhip:["I fire the steel cable from the winch on my arm. It whips out and wraps around them, and the hooks along it bite in. I hit the reel switch and the motor grinds as it hauls them toward me.","I fire the winch cable at a post across the way. The hooks catch and the cable pulls taut. I reel it in slowly, testing the line, then release it and let it wind back with a long rattle."],
 tclap:["I raise the percussion plate on my forearm and slam my fist into it. A shockwave booms out around me, knocking the air out of anyone close. Dust shakes down from the walls and ceiling.","I strike the plate once. The boom echoes across the whole area, loud enough to hear well beyond the walls. Birds scatter, and the sound rolls away into the distance."],
 absorb:["The blast hits me and I slap the Thermal Grid Dissipator flat against my chest. The grid glows bright as it drinks the energy in, the lines across it shining with whatever hit me. It holds it there, humming, ready to come back out on my next strike.","I keep the dissipator grid strapped flat across my chest. If anything hits me, the grid glows and pulls it in. Until then, it hums quietly, waiting."],
 alarm:["Setting the tripwires takes a full minute. In a fight, I'd be kneeling at the doorway stringing wire while everyone else holds them off.","I mount the clockwork bell housing on the frame and start stringing the hair-wires across the doorway. They're so fine they're almost invisible, catching the light only when you look right at them. I wind the spring tensioner until it clicks. If anything brushes a wire, the bell goes off."],
 catapult:["I grab whatever's on hand, a rock, a flask or a dropped helmet, and drop it into the Pneumatic Rail-Sling. I aim down the rail and pull the release. It cracks out like a cannonball and smashes through anything in its path.","I load the sling with whatever needs to cross, aim across the gap and adjust for the distance. When I pull the release, it fires with a sharp crack. It sails over and lands on the far side."],
 cure:["I pull the Pneumatic Stabilizing Syringe from my rig, find you and jab it in. I press the plunger and it hisses as it empties. The bleeding slows, and you can feel the wound starting to pull itself closed.","I take my time with the syringe, check the wound and find a good spot. I push it in and press the plunger down slowly. The wound closes up as it empties, and colour comes back into your face."],
 detect:["I snap the Ultraviolet Radiation Lens down over my eye and spin the focus wheel until it clicks. Through it, anything magical starts to glow with a faint violet hum. I sweep my head across the room, picking out what's enchanted and what isn't.","I lower the UV lens and slowly calibrate the focus wheel, filtering out ordinary light. Then I sweep the room, one corner at a time. The arcane residue shows up as faint, humming light around anything enchanted, and I stop on each one to read it."],
 disguise:["I throw the Light-Refraction Shimmer Mesh over myself and dial it in. The light bends around me and my outline shifts. When it settles, I look like someone else entirely, clothes and all.","I drape the shimmer mesh over myself and take my time adjusting the dials, checking my reflection after each change. My face, clothes and build shift a little at a time until I've got it right. Then I lock it in."],
 expret:["I reach down and kick the hydraulic braces on my knees into overclock. They hiss and pump, pistons driving with every step. I'm across the room before anyone can react, my legs moving far faster than they should.","I lock the knee braces into overclock and they settle into a steady hiss and thump. I set off down the road at a pace my short legs could never manage on their own. The braces keep pumping, mile after mile."],
 ffire:["I load a phosphorus flareshot and fire it into the middle of them. It bursts in mid-air into a cloud of glowing dust that drifts down over everything. Anything it touches lights up, outlined so clearly it can't hide.","I fire a flareshot into the empty space ahead of us. The glowing dust settles slowly over everything in the area. Anything there, whether we could see it or not, ends up outlined in faint light."],
 flife:["I plug the Adrenaline Coagulant Pump into the port on my arm and squeeze the bulb hard. You can see my veins darken as it goes in. My body tightens up, braced and ready to take the hit.","I plug the pump into my arm and squeeze it slowly, letting it work. My veins darken one by one up my arm. It settles in, and I'm braced for whatever comes next."],
 ffall:["As we fall, I yank the release cords on my harness. Compressed air bursts out and the drag-chutes snap open above everyone in range. We all drift down slowly instead of hitting the ground.","The moment the ground gives way, I yank the cords. The drag-chutes pop open with a rush of air above us. We float down slowly and land on our feet."],
 grease:["I shake the lard-aerosol canister hard and spray it across the floor in a wide arc. A thick, white, greasy coating spreads over everything. Anyone standing in it slips and goes down.","I shake the canister and spray a wide, slick patch of grease across the path behind us. It glistens in the light. Anyone following us is going to have a hard time staying on their feet."],
 identify:["Reading an item takes a full minute of steady contact. In a fight, I'd be crouched over the diagnostic frame, flipping toggles, while everything else goes on around me.","I pull out the heavy brass diagnostic frame wired to my pack and set the item in its cradle. I flip the energy current, magnetic field and lens magnification toggles one at a time, and the needles start to twitch. When they settle, I read off what it does, whether it needs attuning and how many charges it has left."],
 jump:["I snap the Pneumatic Boot Springs onto your boots and crank them tight. They hiss and coil, the springs compressing under your weight. When you push off, they launch you far farther than you could ever jump.","I fit the springs to your boots and test the tension with a few turns of the crank. They hiss every time you shift your weight. You're ready for whatever gap or wall is in front of us."],
 longstr:["I kneel and clamp the Kinetic Ankle-Tensioners onto you, cranking them tight. The springs coil with each step. Your stride lengthens, and every footfall pushes you a little farther.","I fit the tensioners before we set out and crank them tight. Every step comes back with a little extra push from the springs. We cover ground faster than we should."],
 purify:["Running the filter takes time and care: setting it up, spinning it and waiting for the sludge to settle. In a fight, there's no time for any of it.","I set up the Centrifugal Chemical Filter next to the food and water and spin it up. It whirs, pulling everything through its chambers. The sludge collects in the trap at the bottom, and what's left is clean."],
 sanct:["I clip the High-Frequency Sensory Scrambler onto you and flip it on. The air around you starts to hum and blur. Anyone trying to attack you has trouble keeping you in focus, and their eyes keep sliding off.","I fit the scrambler on you and turn it on. A high, thin hum hangs in the air around you. Anyone looking straight at you has to work to keep you in focus."],
 snare:["Setting the trap takes a full minute: anchoring the winch, laying the loop and hiding it. In a fight, that's me on my knees laying out cable while everyone else holds the line.","I anchor the spring-loaded steel winch and lay the cable loop out in a circle on the ground. Then I cover it carefully until you can barely tell it's there. I set the trigger and step back. Anyone who walks into it gets yanked off their feet and hoisted upside down."],
 tcb:["I brace the Vitriol Firehose against my hip and open the valve. A thick stream of acid sprays out in a long line, splashing over everything in its path. Wherever it lands, it keeps smoking and burning.","I open the firehose valve just a little. A short burst of acid hisses out onto the ground and pools there. The stone smokes and pits where it sits."],
 aweapon:["I jam the Core Elemental Injector into my weapon and twist the dial. A hiss, and the edge starts to glow with whatever element I've chosen: fire, frost or crackling lightning. It hums in my hand.","I fit the injector to the weapon and slowly twist through the settings, watching the edge change. Fire, then frost, then lightning, each one flickering along the blade. I settle on the one we'll need."],
 aid:["I load the Triple-Dose Endurance Syringe and go down the line, one dose each. It burns going in, and then you feel it hit. A rush of strength and steadiness runs through you.","I line everyone up and give each of you a dose from the syringe. It stings going in, then settles into a warm rush. You feel stronger and steadier, ready for the day."],
 airbubble:["I aim the Brass Respirator Dome at you and fire. It shoots over and snaps shut around your head, sealing with a hiss. Inside, the air is clean and fresh no matter what's outside.","I fit the respirator dome over your head and check the seal all the way around. It hisses as it closes and fills with clean air. Then you're ready to go into the water or the gas."],
 alter:["I pull the heavy cords on the Morphic Chassis Shell. Hidden hydraulic clamps under my skin shift and push, and I wince. Metal claws slide out of my gauntlet, gleaming and sharp.","I pull the cords and the shell goes to work on me, slow and painful. Clamps stretch and reshape me: gill vents open at my neck, or my face shifts into someone else's. It takes a moment, then settles."],
 alock:["I slam the door shut and fit the Resonance-Keyed Deadbolt to it. It hums as it tunes itself, then clicks and locks hard. Whatever's on the other side isn't getting through easily.","I fit the deadbolt to the door, key it to each of us and set the password. It hums once as it tunes itself. Then it seals with a solid click."],
 blur:["I throw the switch on the Silhouette Scrambler. My outline starts to smear and double, the light bending in strange ways around me. You can't tell exactly where I'm standing.","I flick on the scrambler and my outline blurs. It's like looking at me through rippling water. I switch it off and I come back into focus."],
 cflame:["Mounting the burner takes care and steady hands. In a fight, that's me kneeling over the object, fitting brass fixtures while everything goes on around me. Not something I'd stop to do.","I mount the Self-Sustaining Flameless Burner on the object and feed it the material. When I light it, a steady flame comes up that gives off no heat at all. It won't go out, no matter what."],
 dvision:["I pull the photon goggles from my rig, strap them onto you and flick them on. The lenses glow faintly. The dark around you opens up in shades of grey.","I fit the goggles on you and adjust the lenses slowly, a click at a time. Then I flick them on, and the darkness opens up. You can see clearly now, as if there were light."],
 enhance:["I load a stimulant vial into the injector and put it in your arm. It hits fast. You feel stronger, quicker or sharper, whatever this vial was made for.","I pick the right vial for the job, load it and inject you. It takes a moment to kick in. Then you feel it, a boost exactly where you need it."],
 enlarge:["I level the Arcane Scale Modulator and fire. The beam hits, and right in front of you they swell up, or shrink down, their gear changing size with them.","I set the dial on the modulator, aim carefully and fire. The beam hits and the target swells up or shrinks down, its gear changing with it. It wobbles for a moment, then settles at its new size."],
 heatm:["I aim the eddy-current projector at their armour and squeeze the trigger. The metal starts to glow dull red, then brighter, hissing and smoking. They start pulling at it, trying to get it off.","I aim the projector at the lock and hold the trigger. The metal glows a dull red and ticks with heat. The air around it shimmers, and anyone touching it would pull back fast."],
 invis:["I snap the transparency shell onto you and flip it on. The light bends around you and you're gone, nothing left but a faint shimmer if someone knows where to look.","I fit the transparency shell and switch it on. You fade out from the edges in until there's nothing there. Only I know where you're standing."],
 kjaunt:["I plug the Burst-Step Momentum Injector into my leg and it hisses. My movements start to blur and jump. I slip straight through the space where they're standing, and they can't touch me as I pass.","I plug in the injector and my steps start to jump forward in short, sharp bursts. It's disorienting to watch. I move through the crowd like it isn't there."],
 lrest:["I load the Systemic Condition Purge, find a vein and inject it. I push the plunger slowly. Whatever had hold of you drains out, and you can feel your body come back to you.","I take my time, find a good vein and push the purge through slowly. It burns as it works its way through you. Then whatever was wrong with you clears, and your head and body come back to normal."],
 levitate:["I aim the Anti-Gravity Null-Field Harness and fire. A shimmering field locks on, and they lift off the ground, hanging helplessly in mid-air.","I aim the harness at it and slowly lift. The field locks on and it rises off the ground, then hangs there, turning gently in the air."],
 mmouth:["Recording a message takes a full minute of careful work: mounting the unit, speaking into the grille, setting the trigger. In a fight, I'd be crouched over the object while everyone else holds them off.","I mount the Delayed Arcane Playback Unit inside the object and record the message, speaking clearly into the brass grille. I set the trigger and close it up. It clicks shut and waits."],
 mweapon:["I clamp the Resonant Frequency Weapon Charger onto your weapon and hit the switch. The blade starts to hum with a steady, resonant frequency. You can feel it vibrating in your grip.","I fit the charger to your weapon and slowly tune it, adjusting until the hum steadies into a single clear note. The blade vibrates gently in your hand."],
 ppoison:["I jab the anti-toxin injection into you and push the plunger. It goes in cold. The poison starts to burn off and your head clears.","I take my time with the injection, find a good spot and push it through slowly. It goes in cold and spreads. The sickness starts to fade."],
 pyro:["I aim the Flame-to-Effect Conversion Unit at the fire. It sucks the flame into its nozzle with a roar and the fire goes dark. Then it spits it back out as a burst of blinding fireworks, or a thick, rolling wall of smoke.","I aim the conversion unit at the campfire and pull the flame in. It goes dark for a moment. Then I let it back out as a slow, rolling cloud of thick smoke."],
 rtrick:["I thread the rope through the brass anchor ring and twist the portal key. The rope stiffens and rises straight up, and the air at the top warps. An opening appears where we can climb up and hide.","I thread a rope up to sixty foot long through the brass anchor ring fitted with the extradimensional portal key. The rope stiffens and rises vertically, and an invisible entrance opens at the top into a pocket dimension. It warps the light around it, so nobody can see it."],
 seeinv:["I snap the phase-shift detection monocle into place and spin the ring. Through it, things that weren't there a second ago come into view, ghostly and translucent.","I fit the monocle and slowly spin the ring through each phase, scanning the room. I'm looking for anything that shouldn't be there, anything hiding just out of sight."],
 sky:["Writing in the sky takes time and a clear, steady aim. In a fight, I'd be standing still pointing the projector upward while everything happens around me.","I aim the Directed Vapour Trail Projector at the sky and spell out the message in long, careful strokes. Thick white vapour hangs up there, readable from miles away."],
 sclimb:["I clamp the surface-grip pads onto your hands and boots. They bite into the wall the moment you touch it. You can go straight up, or across the ceiling.","I fit the surface-grip pads onto your hands and boots and press one against the wall to test it. It bites and holds firmly. You can go up the wall, or across the ceiling, like it's level ground."],
 vwarp:["I aim the spatial transposition projector at them and fire. The air around them warps and twists. They vanish from where they were standing and reappear where I choose.","I aim the projector at you and line up the spot carefully across the gap. When I fire, the air around you warps and twists, and you blink across to the other side, a little dizzy."],
 web:["I fire two compressed canisters of synthetic adhesive filament at the doorway. They burst open on impact, and the filament erupts into a sticky lattice that fills the space wall to wall. Anything caught in it is stuck fast.","I measure the corridor, adjust the canister pressure and fire once. The filament erupts across the passage and sets with a crackle into a thick, sticky wall. It's very flammable."],
 // actions
 "o:firebolt-arm":["I raise my arm and the amber flares bright under the skin. Heat builds along the seams, then fire vents out of it in a single bolt, straight at them.","I raise my arm and let the amber heat up slowly, the glow building under the skin. Then I send a bolt of fire into the kindling and it catches."],
 "o:scorch":["I brace my feet and extend my arm. The seams along it split open, the amber inside burns bright, and three rays of fire tear loose. The heat runs back through my body and I grit my teeth against it.","I extend my arm and let the seams split. The amber blazes and three rays tear out, scorching whatever they hit. It hurts every time, and my hands are left with fresh scorch marks."],
 "o:gbolt":["The cracks in my mind line up for one instant, and I see the exact angle. A lance of searing light leaves my hand and strikes them. Where it hits, they're left glowing for everyone to see.","I stop and focus, waiting for the cracks to line up. When the angle comes clear, I let the lance of light go. It lights up the area as it passes."],
 "o:axe":["I bring the battleaxe around in a wide swing. It hums and glows with radiant light as it bites into them, leaving a fading arc in the air behind it.","I take the battleaxe off my back and work it into the wood with steady swings. The blade glows softly with every strike, and chips fly in a glowing spray."],
 "o:dagger":["I flick the dagger out of the sheath on my wrist and stab in close, or throw it. It's a plain blade, but it goes exactly where I aim.","I pull the dagger from my wrist sheath and get to work, cutting rope, prying at a seam or slitting open a pouch. It's a plain blade, but it's sharp and I keep it that way."],
 "o:hammer":["I unhook the light hammer from my belt and swing it hard, or throw it end over end. It's a tinker's tool, worn smooth from use, but it hits like a weapon.","I unhook the light hammer and tap slowly along the wall, ear close, listening for hollow spots. Then I set a chisel and knock the pins out of the hinges, one careful strike at a time."],
 "o:pipes":["I lift the pipes to my lips and play. The notes that come out are thin and wrong, and far too close, as if someone else is playing them. The hair on everyone's neck stands up, and they start to back away.","I play the pipes softly. The tune that comes out isn't one I'm playing. It drifts through the area and everything nearby goes quiet."],
 "o:fuel":["The gauges read empty. I plug the feed line into my arm and push. My veins darken and black blood runs into the line as the pack pulls from me, and the gauges climb.","With the tank empty, I plug the feed line into my arm and let it pull from me. My veins darken one by one. The gauges climb slowly as the pack fills."],
 "o:insight":["I go completely still and study it, my eyes tracking every movement. I mutter to myself, working it out: what it is, how it moves, where it's weak.","I study it closely: the body, the tracks, every detail. I compare it against everything I know, piecing together what we're dealing with."],
 "o:pbolt":["I stomp the pedal and the box on my belt pops open. The offensive exhaust vents a bolt of violet energy at them, lighting up the room as it goes.","I stomp the pedal and the box on my belt pops open. A short burst of violet energy vents out of the exhaust and lights the room for a moment, then fades."],
 "o:pstream":["I hold the pedal down and the exhaust valves open wide. A continuous stream of violet energy pours out in a line, and I sweep it across them while the gauges drop fast.","I hold the pedal down and a stream of violet energy pours out of the valves in a straight line. It lights up everything it passes and leaves the air buzzing afterwards."],
 "o:cburst":["I stamp twice and the box fires a pressurised slug of captured spirit. It ruptures into a sphere of violet force that throws everything nearby outward.","I stamp twice and the box fires a pressurised slug at the rubble. It bursts in a sphere of violet force with a deep thump, and the debris is thrown clear of the way."],
 "o:overload":["I open every valve on the box and hold the pedal down. Everything in the tank pours out at once in a single surge into one target, coiling around them like spectral chains and binding them in place.","I open every valve and hold the pedal down. The whole tank empties in one long, violet surge that lights the area like daylight. When it's over, the gauges sit at zero and the box ticks as it cools."],
 "o:boots":["I click my heels together and the boots pull me back along my own path. In a blink I'm standing where I was a moment ago, leaving them swinging at empty air.","I click my heels and step back to where I just was. The boots remember every step I took, and in a blink I'm standing on one of them again, as if I never moved."],
 "o:axelight":["I twist the grip and the battleaxe flares to life, lighting the room bright as a lantern and throwing long shadows. Or I twist it back, the glow dies and we drop into darkness.","I twist the grip and the battleaxe glows like a lantern, throwing a steady light far around us. Shadows pull back from the corners, and I hold it up so everyone can see where they're going."],
 "o:vacuum":["My amber pulses hot as the soul tears loose and starts bouncing off the walls, looking for a way out. I stomp the pedal, the box pops open and violet light floods the room. You see something get pulled into it. It glows, clicks, and I sling it back on.","The soul tears loose and starts bouncing around the room, trying every crack for an exit. I stomp the pedal, the box opens and violet light fills the room, then a hiss from the exhaust valves and a click. All you see is the light, and me watching something you can't."],
 "o:rshield":["The hit lands, and the force cocks the spring-loaded piston on the inside of my shield. I release it, and it slams out with a heavy thud, throwing them back.","I test the piston on the inside of my shield, cocking it by hand. When I release it, it fires out with a heavy thud that shakes my arm. I reset it and check the spring."],
 "o:spark":["I lock the pack's targeting apparatus onto the thread between their body and their soul. I pluck it. They falter, as if something inside them just slipped.","I lock the pack's targeting onto the faint thread between someone's body and soul and give it a gentle pluck. Through the lens I watch it shiver and settle back into place."],
 "o:axeblind":["The blow lands, and I squeeze the axe grip. The battleaxe flares like a struck magnesium strip, right in their face, blinding them.","I squeeze the grip and the battleaxe flares bright for an instant, a white flash that lights every corner of the room. Then it fades back to its soft glow."],
 "o:mind":["My focus starts to slip. The sharpener at my temple ticks, a cold pulse runs behind my eyes, and the thread I was holding snaps back into place.","Something distracts me mid-task and my focus starts to drift. The sharpener ticks at my temple, a cold pulse runs behind my eyes and my focus comes back."],
 "o:oa":["They try to slip past me, and I don't let them. As they turn to leave my reach, I lash out with one quick, practised strike.","It only comes up when someone tries to slip away from me in a fight. Outside of one, I just keep my weapon close and my eyes on anyone I don't trust."]

const R = n => 1+Math.floor(Math.random()*n);
function roll(expr){
 expr=String(expr).replace(/@int/g,M("int")).replace(/\s/g,"");
 let total=0, parts=[], m, re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;
 while((m=re.exec(expr))){
  if(m[3]){ const n=+(m[2]||1), f=+m[3], sgn=m[1]==="-"?-1:1, rs=[]; for(let i=0;i<n;i++) rs.push(R(f)); const sum=rs.reduce((a,b)=>a+b,0); total+=sgn*sum; parts.push({d:`${n}d${f}`,rs}); }
  else if(m[5]){ const v=(m[4]==="-"?-1:1)*(+m[5]); total+=v; parts.push({mod:v}); }
 }
 return {total,parts,expr};
}
function maxRoll(expr){ const e=String(expr).replace(/@int/g,M("int")).replace(/\s/g,""); let t=0,m,re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g; while((m=re.exec(e))){ if(m[3]) t+=(m[1]==="-"?-1:1)*(+(m[2]||1))*(+m[3]); else if(m[5]) t+=(m[4]==="-"?-1:1)*(+m[5]); } return t; }
const critDmg = expr => maxRoll(expr)+PB();
const diceOnly = expr => String(expr).replace(/@int/g,"0").match(/\d*d\d+/g)?.join("+")||"0";
const showParts = r => r.parts.map(p=>p.d?`${p.d}[${p.rs.join(",")}]`:sg(p.mod)).join(" ");
function pushRoll(title, html, plain){
 try{ if(S.settings.haptics && navigator.vibrate) navigator.vibrate(15); }catch(e){}

 const rb=document.getElementById("rollbar"); rb.classList.remove("flash"); void rb.offsetWidth; rb.classList.add("flash");
}
function rollFactors(kind, abil, skill){
 const adv=[], dis=[], notes=[], auto=[]; const c=S.cond||{};
 if(kind==="check"||kind==="init"){
  if(S.exh>=1) dis.push("Exhaustion "+S.exh+" (disadvantage on ability checks)");
  if(c.Poisoned) dis.push("Poisoned");
  if(c.Frightened) dis.push("Frightened, while the source is in sight");
  if(c.Blinded) notes.push("Blinded: a check that relies on sight automatically fails.");
  if(c.Deafened) notes.push("Deafened: a check that relies on hearing automatically fails.");
 }
 if(kind==="save"){
  if(S.exh>=3) dis.push("Exhaustion "+S.exh+" (disadvantage on saving throws)");
  if(abil==="wis") dis.push("Amber-Veined: disadvantage on Wisdom saves");
  if(abil==="san") adv.push("Grave Resilience: advantage on Sanity and Composure saves");
  if(abil==="dex" && c.Restrained) dis.push("Restrained (Dex saves)");
  const fail=["Paralyzed","Stunned","Unconscious","Petrified"].filter(k=>c[k]);
  if((abil==="str"||abil==="dex") && fail.length) auto.push(`${fail.join(", ")}: you automatically fail Str and Dex saves`);
  if((abil==="str"||abil==="dex") && (S.inventions||[]).some(v=>/recoil-damper/i.test(v.n))) notes.push("Hydraulic Recoil-Damper: advantage if this save is against being grappled, knocked prone or shoved.");
  if(abil==="con" && S.conc) notes.push(`Concentrating on ${S.conc}: a failed save to keep it ends it${fxOn("mind")&&S.ch.mind>0?" unless you spend a Mind Sharpener charge":""}.`);
 }
 if(kind==="attack"){
  if(S.exh>=3) dis.push("Exhaustion "+S.exh+" (disadvantage on attack rolls)");
  if(c.Poisoned) dis.push("Poisoned"); if(c.Frightened) dis.push("Frightened, while the source is in sight");
  if(c.Prone) dis.push("Prone"); if(c.Restrained) dis.push("Restrained"); if(c.Blinded) dis.push("Blinded");
  if(c.Invisible) adv.push("Invisible (attackers can't see you)");
 }
 if(S.insp) notes.push("You have Inspiration: you can spend it for advantage.");
 const mode = auto.length?"fail" : adv.length&&dis.length?"cancel" : adv.length?"adv" : dis.length?"dis" : "";
 return {adv,dis,notes,auto,mode};
}
function rollPrompt(label, kind, abil, skill, parts){

 const cls={adv:"adv",dis:"dis",cancel:"flat",fail:"fail","":"flat"}[f.mode];
 let result="";
 if(!PERSON() && f.mode!=="fail"){ const a=R(20), b=R(20); const pick=f.mode==="adv"?Math.max(a,b):f.mode==="dis"?Math.min(a,b):a; const two=f.mode==="adv"||f.mode==="dis";
  result=`<div class="rollcard" style="margin-top:8px"><div class="big">${pick+bonus}</div><div class="small dim">d20 [${a}${two?", "+b:""}]${two?" keep "+pick:""} ${sg(bonus)}${pick===20?" · NAT 20":pick===1?" · NAT 1":""}</div></div>`;

 else pushRoll(label,"",f.mode==="fail"?"automatic failure":`Roll <b>d20 ${sg(bonus)}</b>${f.mode==="adv"?" with advantage":f.mode==="dis"?" with disadvantage":""}`);
 const reasons=[...f.auto.map(x=>`<li style="color:#ffb3a8">${esc(x)}</li>`),...f.adv.map(x=>`<li style="color:var(--heal)">Advantage: ${esc(x)}</li>`),...f.dis.map(x=>`<li style="color:#ffb3a8">Disadvantage: ${esc(x)}</li>`)];
 document.getElementById("modal").innerHTML=`<div class="modalbg" data-act="close"><div class="modal rollpop" data-act="close" role="dialog">
  <div class="muted small" style="letter-spacing:1px;text-transform:uppercase;font-weight:700">${esc(label)}</div>

  ${reasons.length?`<ul>${reasons.join("")}</ul>`:""}
  <div class="small" style="margin-top:8px"><b>Modifiers:</b> ${parts.map(p=>`${esc(p[0])} ${sg(p[1])}`).join(" · ")||"none"}</div>
  ${f.notes.length?`<ul class="muted">${f.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
  ${result}
  <div class="tapclose">Tap anywhere to close</div></div></div>`;
 save();
}

function d20(label,bonus,opts={}){
 if(PERSON()){ const how=opts.adv?" with advantage (roll 2, keep the higher)":opts.dis?" with disadvantage (roll 2, keep the lower)":""; pushRoll(label,"",`Roll <b>d20 ${sg(bonus)}</b>${how}`); save(); return null; }
 const a=R(20), b=R(20);
 const tag = opts.adv?"ADV":opts.dis?"DIS":"";
 const pick = opts.adv?Math.max(a,b):opts.dis?Math.min(a,b):a;
 const tot=pick+bonus;
 const nat = pick===20?" <span class='chip ok'>NAT 20</span>":pick===1?" <span class='chip red'>NAT 1</span>":"";
 const html=`<div class="rollcard"><div class="muted small">${esc(label)} ${tag?`<span class="chip ${opts.adv?'ok':'red'}">${tag}</span>`:""}</div><div class="big">${tot}</div><div class="small dim">d20 [${a}${tag?", "+b:""}] ${sg(bonus)}${tag?"":` · 2nd d20 if you have adv/dis: ${b+bonus}`}${nat}</div></div>`;
 pushRoll(label, html, `<b>${tot}</b> <span class="dim">(d20 ${pick}${sg(bonus)}${tag?" "+tag:""}${tag?"":", alt "+(b+bonus)})</span>`);
 save(); return {tot,a,b,pick};
}

function setStress(n,why){
 n=Math.max(0,Math.min(5,n));
 if(n!==S.stress){ logEv(`Stress ${S.stress} → ${n}${why?" ("+why+")":""}`); S.stress=n; }
}
function setEnergy(n,why){ n=Math.max(0,Math.min(eMax(),n)); if(n!==S.energy){ logEv(`Energy ${S.energy} → ${n}${why?" ("+why+")":""}`); S.energy=n; } }
function damage(n,type,resist){
 let amt = resist? Math.floor(n/2) : n;
 let rem=amt, absorbed=Math.min(S.hp.temp,rem); S.hp.temp-=absorbed; rem-=absorbed;
 const before=S.hp.cur; S.hp.cur=Math.max(0,S.hp.cur-rem);
 logEv(`Took ${amt}${type?" "+type:""} damage${resist?" (halved from "+n+")":""}${absorbed?", "+absorbed+" from temp HP":""}. HP ${before} → ${S.hp.cur}`);
 let notes=[];
 if(S.conc && amt>0 && S.hp.cur===0){ logEv(`Concentration on ${S.conc} ended (dropped to 0 HP)`); notes.push(`Your concentration on ${S.conc} ended because you dropped to 0 HP.`); S.conc=""; }
 if(S.conc && amt>0 && S.settings.concReminder) UI.concPending={amt,dc:Math.max(10,Math.floor(amt/2))};
 if(false) notes.push(`Concentration on ${S.conc}: Con save DC ${Math.max(10,Math.floor(amt/2))} (you're +${saveBonus("con")}).${fxOn("mind")&&S.ch.mind>0?" Mind Sharpener can auto-succeed.":""}`);
 if(S.hp.cur===0 && before>0) notes.push("You're at 0 HP. Death saves are on the HP panel.");
 return {amt,notes};
}
function heal(n){ const b=S.hp.cur; S.hp.cur=Math.min(maxHp(),S.hp.cur+n); if(S.hp.cur>0){S.ds={s:0,f:0};} logEv(`Healed ${n}. HP ${b} → ${S.hp.cur}`); }

/* ======================= RENDER: LONG REST ======================= */
/* ---------- Long rest plan: research and tinkering, in priority order ---------- */
const bpHrs = k => Math.max(1,BPK[k].l);
const itemHrs = it => it.t==="bp" ? bpHrs(it.k) : 1;
const itemName = it => it.t==="bp" ? BPK[it.k].n : (it.n||"Unnamed device");
function planItems(){ const P=S.rplan, L=S.lr, took=(L.active&&L.plan)?L.plan.take:[];
 P.items=(P.items||[]).filter(it=> it.t==="tk" ? (!it.built || took.includes(it.id)) : (BPK[it.k] && (!S.researched[it.k] || took.includes(it.id)))); return P.items; }
// Go down the plan and take each item whose full hours still fit. Nothing is split.
function planFit(hours){ let left=Math.max(0,hours); const take=[]; planItems().forEach(it=>{ const h=itemHrs(it); if(h<=left){ take.push(it.id); left-=h; } }); return {take,left}; }
function planPending(){ const L=S.lr; if(!L.active||!L.plan) return 0; return planItems().filter(it=>it.t==="tk" && L.plan.take.includes(it.id) && !L.plan.tkDone[it.id]).length; }
const lrUsed = () => { const L=S.lr; return (L.used||0)+(+L.other||0)+planPending(); };
function planTake(id,on){ const L=S.lr, it=planItems().find(x=>x.id===id); if(!it||!L.plan) return; const i=L.plan.take.indexOf(id);
 if(on && i<0){ L.plan.take.push(id); if(it.t==="bp" && !S.researched[it.k]){ L.research.push(it.k); S.researched[it.k]=true; L.used+=bpHrs(it.k); } }
 else if(!on && i>=0){ if(it.t==="tk" && L.plan.tkDone[id]) return; L.plan.take.splice(i,1); if(it.t==="bp"){ const j=L.research.indexOf(it.k); if(j>=0){ L.research.splice(j,1); S.researched[it.k]=false; L.used=Math.max(0,L.used-bpHrs(it.k)); } } } }
const TKLAB = t => { const T=TIERS[t]||TIERS[0]; return `T${T[0]} ${T[2]} (${T[1]}+)`; };
function planPanel(where){
 const items=planItems(), hrs=S.lr.hours, fit=planFit(hrs);
 const todo=BP.filter(b=>!S.researched[b.k] && !items.some(it=>it.t==="bp"&&it.k===b.k));
 const opts=[0,1,2].map(l=>{ const g=todo.filter(b=>b.l===l); return g.length?`<optgroup label="${l?"Level "+l:"Cantrips"} · ${Math.max(1,l)} h each">${g.map(b=>`<option value="${b.k}">${esc(b.n)} (${Math.max(1,b.l)} h)</option>`).join("")}</optgroup>`:""; }).join("");
 const tot=items.reduce((a,it)=>a+itemHrs(it),0);
 return `<div class="panel" style="margin-top:12px">
  <h2>Long rest plan <span class="cnt ${tot>hrs?"over":""}">${items.length} planned · ${tot} h of ${hrs} h</span></h2>
  <p class="small dim">Research and tinkering in the order you want them done. When a long rest begins, it takes each item that fits in the hours left. An item that doesn't fit is skipped and waits for a later rest; nothing is split across rests.</p>
  <div class="col" style="margin-top:8px">${items.length?items.map((it,i)=>{ const h=itemHrs(it), ok=fit.take.includes(it.id);
    const tag=it.t==="bp"?`<span class="lvl ${BPK[it.k].l?"":"c"}">${BPK[it.k].l?"L"+BPK[it.k].l:"C"}</span>`:`<span class="tier tier${it.tier}">T${it.tier}</span>`;
    const nm=it.t==="bp"?`<span class="info" data-act="bpInfo" data-k="${it.k}">${esc(BPK[it.k].n)}</span>`:esc(itemName(it));

function spendEco(slot){ if(S.combat.on){ S.combat[slot]=true; } }
const SLOT = t => t==="b"?"bon":t==="r"?"rea":"act";
function ocApply(){ if(!S.combat.oc) return 0; S.combat.oc=false; S.combat.ocUsed=true; setStress(S.stress+1,"Overclock"); return 3; }
function tellCard(label,ocB,lines){ return `<div class="rollcard"><div class="muted small">${esc(label)} · roll at the table${ocB?' <span class="chip red">Overclocked</span>':""}</div>${lines.map(l=>`<div class="tell">${l}</div>`).join("")}</div>`; }
function attackModeLine(){ const f=rollFactors("attack"); if(!f.mode) return ""; const why=[...f.adv.map(x=>"advantage: "+x),...f.dis.map(x=>"disadvantage: "+x)].join("; ");
 return f.mode==="adv"?`<span style="color:var(--heal)">Roll with <b>advantage</b> (${esc(why)}).</span>`:f.mode==="dis"?`<span style="color:#ffb3a8">Roll with <b>disadvantage</b> (${esc(why)}).</span>`:`<span class="muted">Advantage and disadvantage cancel (${esc(why)}).</span>`; }
function resolveAttack(label,atkB,dmgExpr,dt,ocB,spell){
 const am=attackModeLine();
 if(PERSON()){ const ex=String(dmgExpr).replace(/@int/g,M("int")), cd=diceOnly(dmgExpr);
  const lines=[`Roll <b>d20 ${sg(atkB+ocB)}</b> to hit${ocB?" (includes Overclock +3)":""}.`,...(am?[am]:[]),`On a hit, roll <b>${ex}</b> ${dt} damage.`,`Natural 20: don't roll damage. It's <b>${critDmg(dmgExpr)}</b> ${dt} (max ${maxRoll(dmgExpr)} + proficiency ${PB()}).`];
  if(spell!==false) lines.push(`Beat its AC by 5 or more: add <b>${B().level>=15?"3d6":B().level>=9?"2d6":"1d6"}</b> force (Soul-Targeted, once per turn).`);
  pushRoll(label,"",`Roll <b>d20 ${sg(atkB+ocB)}</b>, then <b>${ex}</b> ${dt}`); return tellCard(label,ocB,lines); }
 const fm=rollFactors("attack").mode; let a=R(20),b=R(20); if(fm==="adv"){ const t=Math.max(a,b); b=Math.min(a,b); a=t; } else if(fm==="dis"){ const t=Math.min(a,b); b=Math.max(a,b); a=t; } const bonus=atkB+ocB;
 const nat20=a===20; const d=nat20?{total:critDmg(dmgExpr),parts:[{mod:critDmg(dmgExpr)}]}:roll(dmgExpr);
 const html=`<div class="rollcard"><div class="muted small">${esc(label)}${ocB?' <span class="chip red">Overclocked +3</span>':""}</div>
  <div class="btns" style="align-items:baseline"><span class="big">${a+bonus}</span><span class="small dim">to hit · d20 [${a}${fm==="adv"||fm==="dis"?", "+b+" "+fm.toUpperCase():""}] ${sg(bonus)}${fm==="adv"||fm==="dis"?"":" · alt "+(b+bonus)}${a===20?' <span class="chip ok">CRIT</span>':a===1?' <span class="chip red">NAT 1</span>':""}</span></div>
  <div class="btns" style="align-items:baseline;margin-top:4px"><span class="big red">${d.total}</span><span class="small dim">${dt} · ${nat20?`natural 20: max ${maxRoll(dmgExpr)} + proficiency ${PB()}`:`${showParts(d)} · a natural 20 would be ${critDmg(dmgExpr)}`}</span></div>${am?`<div class="small" style="margin-top:4px">${am}</div>`:""}</div>`;
 pushRoll(label,html,`<b>${a+bonus}</b> to hit, <b>${d.total}</b> ${dt}${nat20?" (natural 20: max + proficiency)":""}`);
 return html;
}
function resolveSave(label,dc,save,dmgExpr,dt,ocB,extra){
 if(PERSON()){ const ex=dmgExpr?String(dmgExpr).replace(/@int/g,M("int")):"";
  const lines=[`The target makes a <b>DC ${dc+ocB} ${save}</b> saving throw${ocB?" (includes Overclock +3)":""}.`];
  if(ex) lines.push(`Roll <b>${ex}${ocB?" + 3":""}</b> ${dt}: full damage on a fail, half on a success.`);
  if(extra) lines.push(`<span class="small muted">${extra}</span>`);
  pushRoll(label,"",`Target: DC <b>${dc+ocB}</b> ${save}${ex?`, you roll <b>${ex}${ocB?"+3":""}</b>`:""}`); return tellCard(label,ocB,lines); }
 const d=dmgExpr?roll(dmgExpr):null; const tot=d?d.total+ocB:0;
 const html=`<div class="rollcard"><div class="muted small">${esc(label)}${ocB?' <span class="chip red">Overclocked +3</span>':""}</div>
  <div class="btns" style="align-items:baseline"><span class="big">DC ${dc+ocB}</span><span class="small dim">${save} save</span></div>
  ${d?`<div class="btns" style="align-items:baseline;margin-top:4px"><span class="big red">${tot}</span><span class="small dim">${dt} on a fail · ${Math.floor(tot/2)} on a success · ${showParts(d)}${ocB?" +3":""}</span></div>`:""}
  ${extra?`<div class="small muted">${extra}</div>`:""}</div>`;
 pushRoll(label,html,`DC <b>${dc+ocB}</b> ${save}${d?`, <b>${tot}</b> ${dt} (half ${Math.floor(tot/2)})`:""}`);
 return html;
}
function useOption(id){

 if(C.on && !C.mine && (o.slot==="act"||o.slot==="bon")){ C.plan=C.plan||{act:null,bon:null,oc:false,note:""}; C.plan[o.slot]=id; pushRoll("Planned",``,`<b>${esc(o.n)}</b> for your next ${o.slot==="act"?"action":"bonus action"}`); save(); render(); return; }

 if(S.settings.confirmSpend && costly && UI.confirmed!==id){ modal(`<h2>Use ${esc(o.n)}?</h2><p class="muted">${o.cost?esc(o.cost)+" · ":""}${o.meta}</p><div class="btns" style="margin-top:10px"><button class="btn pri" data-act="useConfirm" data-k="${id}">Use it</button><button class="btn" data-act="close">Cancel</button></div>`); return; }

 if(o.kind==="gadget"){ const gb=BPK[S.loadout[o.gi].key], cc=concConflict(gb); if(cc && UI.concOk!==id){ concModal(gb,cc,`data-act="concOk" data-k="${id}"`); return; } }
 UI.concOk=null;

 switch(o.kind){

    html=`<div class="rollcard"><div class="muted small">Scorching Ray (arm)</div><div class="small">${rays}</div><div class="small" style="margin-top:6px">Con save to withstand it: <b>${con}</b> (DC set by the DM)</div></div>`; pushRoll("Scorching Ray",html,`3 rays, Con save ${con}`); break; }
  case "discharge": {

  case "fuel": fuelModal(); return;
  case "insight": insightModal(); spendEco(slot); save(); render(); return;

  case "rshield": S.ch.rshield--; logEv("Repulsion Shield push"); html=`<div class="rollcard"><div class="big">Pushed</div><div class="small muted">Attacker shoved up to 15 ft away. ${S.ch.rshield} charges left.</div></div>`; pushRoll(o.n,html,"attacker pushed 15 ft"); break;
  case "fog": S.lim.fog=Math.max(0,(S.lim.fog??fogMax())-1); logEv("Flash of Genius"); html=`<div class="rollcard"><div class="big">${sg(M("int"))}</div><div class="small muted">Add it to that ability check or saving throw. ${S.lim.fog} left until a long rest.</div></div>`; pushRoll(o.n,"",`add <b>${sg(M("int"))}</b> to the roll`); break;
  case "spark": if(PERSON()){ S.lim.spark=0; logEv("Guiding Spark"); html=tellCard("Guiding Spark",0,["Roll <b>1d4</b>. The creature subtracts it from its saving throw."]); pushRoll(o.n,"","Roll <b>1d4</b>, they subtract it"); break; } { S.lim.spark=0; const d=R(4); logEv("Guiding Spark"); html=`<div class="rollcard"><div class="muted small">Guiding Spark</div><div class="big ecto">−${d}</div><div class="small muted">to the creature's saving throw</div></div>`; pushRoll(o.n,html,`<b>−${d}</b> to their save`); break; }

function deployGadget(i, ocB){
 const g=S.loadout[i], b=BPK[g.key]; if(!g||!b) return "";

  askRolls(b.c,(fl&&showFl()?`<div class="flav" style="font-size:14px">${esc(fl)}</div>`:"")+`<div class="tell">Roll <b>${ex}</b> for the hit points restored.</div><p class="small muted">${esc(b.fx)}</p>`,[{k:"h",label:`Total of ${ex}`},{k:"me",type:"flag",label:"The target is me (Flint)"}],

   v=>{ const had=S.hp.temp; if(v.h>S.hp.temp) S.hp.temp=v.h; logEv(`False Life: ${v.h} temp HP`); return `<div class="ectobox">${v.h>had?`You now have ${v.h} temporary HP.`:`You keep your ${had} temp HP (temp HP doesn't stack).`}</div>`; });
  return null; }
 else if(b.heal){ const h=roll(b.heal); html=`<div class="rollcard"><div class="muted small">${b.n}</div><div class="big" style="color:var(--heal)">${h.total}</div><div class="small dim">healed · ${showParts(h)}</div></div><div class="btns" style="margin-top:6px"><button class="btn ok sm" data-act="healMe" data-n="${h.total}">It was me: heal ${h.total}</button></div>`; pushRoll(b.n,html,`heals <b>${h.total}</b>`); }

 else { html=`<div class="rollcard"><div class="muted small">Deployed</div><div class="big" style="font-size:22px">${esc(b.c)}</div></div>`; pushRoll(b.n,html,"deployed"); }

}

function vacApply(row,total,rs,breach){

function finishInv(cost,r,fIn){
  if(S.lr && S.lr.active){ S.lr.used+=1; S.lr.tinker=(S.lr.tinker||0)+1; }
  const name=(UI.wbName||"").trim()||"Unnamed device", tier=+(UI.wbTier||0), dc=TIERS[tier][1];
  let res, cls;
  if(r<=5){ const f=fIn!=null?fIn:(PERSON()?0:R(6)), dmg=Math.floor(f/2); if(f) damage(f,"fire",true); setStress(S.stress+1,"meltdown"); S.scrap=Math.max(0,S.scrap-cost); res=`<b>Catastrophic meltdown.</b> It turns to molten slag in your hands. ${cost} gp of materials destroyed. ${f?`You take ${dmg} fire (${f}, halved by resistance)`:`Roll 1d6 fire (halved by resistance) and take it on the HP panel`} and 1 Stress.`; cls="redbox"; }
  else if(r<dc){ res=`<b>Failure.</b> The blueprint doesn't work. Materials are fine, but your fixation on the broken device makes you ignore your physical limits (ask the DM).`; cls="warnbox"; }
  else {
   S.scrap=Math.max(0,S.scrap-cost);
   let snapped="";
   if(S.inventions.length>=invCap()){ const o=S.inventions.shift(); snapped=` Your oldest invention, <b>${esc(o.n)}</b>, violently snaps.`; logEv(`${o.n} snapped (over invention limit)`); }
   S.inventions.push({id:nid(),n:name,tier,note:(UI.wbNote||"")+(r>=95?" [Critical: minor bonus]":"")});
   res= r>=95?`<b>Critical success!</b> ${esc(name)} works flawlessly and gains a minor bonus (range, durability, or silent). ${cost} gp used.${snapped}`:`<b>Success.</b> ${esc(name)} works as planned. ${cost} gp used.${snapped}`; cls="ectobox";
   UI.wbName="";UI.wbNote="";
  }
  logEv(`Tinkered ${name} (T${tier}): d100 ${r}`);
  if(UI.wbPlanId){ const pid=UI.wbPlanId; UI.wbPlanId=null; const it=(S.rplan.items||[]).find(x=>x.id===pid); const word=r<=5?"Meltdown":r<dc?"Failed":r>=95?"Critical success":"Success";
   if(S.lr.active && S.lr.plan){ S.lr.plan.tkDone[pid]=word; if(!S.lr.plan.take.includes(pid)) S.lr.plan.take.push(pid); S.lr.used=Math.max(0,S.lr.used); }
   if(it){ if(r>=dc && r>5){ it.built=true; if(!(S.lr.active&&S.lr.plan)) planItems(); } else it.last=`${word} (d100 ${r})`; } }
  UI.wbResult=`<div class="${cls}">d100 <b class="num">${r}</b> vs ${dc}+ · ${res}</div>`;
  pushRoll("Invention",``,`d100 <b>${r}</b> vs ${dc}+`);
  save(); render(); closeModal(); concPrompt();
}

 lrBegin:()=>{ UI.hdLast=""; const h=S.lr.hours, kind=S.lr.kind||"long"; S.lr={kind,active:true,hours:h,used:0,done:{},research:[],tinker:0,hdCur:0,useCur:false,started:Date.now(),opts:{stress:S.settings.lrStress!=="keep",keep:false,dawn:true,temp:S.hp.temp>0}}; logEv(`${kind==="short"?"Short":"Long"} rest started (${h} h)`);
  if(kind==="long"){ S.lr.plan={take:[],tkDone:{}}; const f=planFit(h); f.take.forEach(id=>planTake(id,true)); if(f.take.length){ S.lr.done.research=true; logEv(`Rest plan: ${planItems().filter(it=>f.take.includes(it.id)).map(it=>itemName(it)).join(", ")}`); } }
  if(kind==="long"){ const per=Math.max(1,1+M("con")), prior=B().level-S.hdUsed, target=maxHp()-(S.hp.bonus||0), missing=target-S.hp.cur;

 doRest:d=>{
  const dep=S.loadout.filter(g=>g.dep).length; S.loadout.forEach(g=>g.dep=false); S.lim.spark=1;
  let sum=[`${dep} gadgets reset`,"Guiding Spark back"];
  if(d.k==="long"){
   const clr=document.getElementById("lr-stress").classList.contains("on"), keep=document.getElementById("lr-keep").classList.contains("on"), dawn=document.getElementById("lr-dawn").classList.contains("on"), tmp=document.getElementById("lr-temp").classList.contains("on");
   if(S.hp.bonus){ sum.push(`extra ${S.hp.bonus} max HP ended`); logEv(`Extra ${S.hp.bonus} max HP ended (long rest)`); S.hp.bonus=0; }
   S.hp.cur=Math.min(S.hp.cur,maxHp()); if(tmp) S.hp.temp=0; S.ds={s:0,f:0};
   S.hdUsed = (S.lr && S.lr.active) ? (S.lr.hdCur||0) : 0;
   if(S.exh>0) S.exh--;
   S.lim.gbolt=1; S.lim.fuel=1; S.lim.fog=fogMax();
   if(clr) setStress(0,"long rest");
   if(S.energy){ if(keep && S.stress<5){ setStress(S.stress+1,"kept pack energy"); sum.push(`kept ${S.energy} energy for 1 Stress`); } else { const l=Math.ceil(S.energy/2); setEnergy(S.energy-l,"long rest bleed-off"); sum.push(`pack lost ${l} energy`); } }
   if(dawn){ for(const [k,f] of Object.entries(FX)){ if(!f.max||!fxOn(k)) continue; const din=document.getElementById("dawn-"+k); const g=f.regain==="all"?f.max:(din&&din.value!==""?Math.max(0,+din.value):(PERSON()?0:roll(f.regain).total)); const b=S.ch[k]; S.ch[k]=Math.min(f.max,S.ch[k]+g); if(S.ch[k]!==b) sum.push(`${f.n} +${S.ch[k]-b}`); } }
   S.conc="";
   sum.unshift(S.lr&&S.lr.autoHeal?`healed to max with ${S.lr.autoHeal.n} of yesterday's hit dice before the rest`:`HP ${S.hp.cur}/${maxHp()} (from hit dice; no automatic healing)`, `hit dice ${B().level-S.hdUsed}/${B().level}`);
  }
  UI.restOpen=false;
  if(S.lr && S.lr.active && S.lr.plan){ const skipped=planItems().filter(it=>!S.lr.plan.take.includes(it.id) || (it.t==="tk"&&!S.lr.plan.tkDone[it.id])); S.lr.plan=null; planItems(); if(skipped.length) sum.push(`still planned for a later rest: ${skipped.map(it=>itemName(it)).join(", ")}`); }
  if(S.lr && S.lr.active && (S.lr.kind||"long")===d.k){ sum.push(`${lrUsed()} of ${S.lr.hours} hours used${S.lr.research.length?`, researched ${S.lr.research.map(k=>BPK[k].n).join(", ")}`:""}${S.lr.tinker?`, ${S.lr.tinker} tinkering attempt${S.lr.tinker>1?"s":""}`:""}`); S.lr.active=false; }
  logEv(`${d.k==="long"?"Long":"Short"} rest: ${sum.join(", ")}`); save(); render();
  if(d.k==="long"){ const br=autoBackup("long rest"); if(br==="ok") sum.push("backup saved to Downloads/Flint"); }
  toastModal(d.k==="long"?"Long rest done":"Short rest done",`<ul class="small">${sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>${d.k==="long"?'<p class="small muted">Swap your gadget load-out and Mechanical Modifications now if you want.</p>':""}`);

 moveK:d=>{ const G=loadGroups(); const i=G.findIndex(x=>x.b.k===d.k), j=i+(+d.d); if(i<0||j<0||j>=G.length) return; [G[i],G[j]]=[G[j],G[i]]; S.loadout=G.flatMap(x=>x.all.map(k=>S.loadout[k])); save(); render(); },
 undoUse:d=>{ const g=S.loadout[+d.i]; if(g && g.dep){ g.dep=false; logEv(`Undid use of ${BPK[g.key].c}`); save(); render(); } closeModal(); },
 deploy:d=>{ const i=+d.i, b=BPK[S.loadout[i].key]; const cc=concConflict(b); if(cc && UI.concOkI!==String(i)){ concModal(b,cc,`data-act="concOk" data-i="${i}"`); return; } UI.concOkI=null; const ocB=S.combat.on?ocApply():0; const h=deployGadget(i,ocB); spendEco(SLOT(b.t)); save(); render(); if(h) toastModal(b.c,h); },
 deployK:d=>{ const bk=BPK[d.k]; if(S.combat.on && !S.combat.mine && bk.t!=="r" && bk.t!=="1m"){ const slot=bk.t==="b"?"bon":"act"; S.combat.plan[slot]="g:"+d.k; pushRoll("Planned","",`<b>${esc(bk.c)}</b> for your next ${slot==="act"?"action":"bonus action"}`); save(); render(); return; } const i=S.loadout.findIndex(g=>g.key===d.k && (!g.dep||BPK[g.key].l===0)); if(i<0) return; ACT.deploy({i:String(i)}); },
 unloadK:d=>{ let i=-1; S.loadout.forEach((g,j)=>{ if(g.key===d.k && (i<0 || (g.dep && !S.loadout[i].dep))) i=j; }); if(i<0) return; S.loadout.splice(i,1); logEv(`Dismantled one ${BPK[d.k].c}`); save(); render(); },

  finishInv(R(10),R(100),null); },
