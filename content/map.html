<!-- Interactive Map of Barovia: Click on the pins to learn more about each location.  -->

<div id="info-panel" class="hidden">
  <h2 id="location-name">Select a location</h2>
  <p id="location-desc"></p>
  <button type="button" onclick="document.getElementById('info-panel').classList.add('hidden')">✕ Close</button>
</div>

<script>
  const locationInfo = {
    "Vallaki": {
      description: "A walled town of roughly 1200 people. Now under Lady Fiona Wachter as Baronness. The old 'All will be well' motto is no longer enforced. Founded over 500 years ago by Boris Valak. The Luna River runs nearby.",
      subLocations: ["Saint Andral's Church", "Blue Water Inn", "Wachterhaus", "Baron's Keep"]
    },
    "Saint Andral's Church": {
      description: "Father Lucian's church. The holy bones were stolen and recovered — divine protection restored. Ireena sheltered here safely after the wanted posters went up."
    },
    "Blue Water Inn": {
      description: "Run by Erwin and Danika Martikov — both Keepers of the Feather. Destroyed by Isek's rampage, presumably repaired now he's dead."
    },
    "Wachterhaus": {
      description: "Lady Fiona Wachter's home, now the seat of Vallaki's Baronness. The cellar sits on a Layline — used for the Ethereal Plane ritual. Stella is here, recovered. A terrible creature reportedly lives in the cellar."
    },
    "Baron's Keep": {
      description: "A fortified structure in Vallaki. Viktor's room has his teleportation circle and the mirror where Stella was visible for months. Isek's attic was lined with Ireena dolls. Library holds historical faction records. Udo was chained in a closet here."
    },
    "Krezk": {
      description: "Walled town past the Raven River to the northwest, protected by 20-foot-tall walls. Features a blessed pool. Saint Markovia’s Abbey is located here, where screams and laughter echo from within; it is managed by the Abbott, an ageless figure who serves as a healer and creator of abominations. Zelly (Esmerelda Davenir) has been encountered here. The village has struggled with werewolf attacks and a family curse affecting the Baron’s line. The party is investigating the creation of a bride for Strahd.",
      subLocations: ["Saint Markovia's Abbey"]
    },
    "Saint Markovia's Abbey": {
      description: "Ancient abbey in Krezk. Screams and laughter echo from within. Managed by the Abbott, an ageless figure who serves as a healer and creator of abominations. Zelly has been encountered here. Connected to the party's investigation into the creation of a bride for Strahd."
    },
    "Kazan's Tower": {
      description: "Wizard Kazan's tower on a causeway into Lake Baratok. Iron door inscribed with his name, radiating Abjuration magic. Gargoyles guard it. Esmeralda Davenir's wagon was outside. Van Richter's journal and the Tarokka card The Hooded One were found here. Kazan's magic staff may still be inside.",
      subLocations: ["Esmeralda's Wagon"]
    },
    "Esmeralda's Wagon": {
      description: "The mobile home of the Vistani seer, Esmeralda Davenir, who provides guidance and prophecy to those who seek it. Last known location: Lake Baratok."
    },
    "Tser Pool Encampment": {
      description: "Vistani camp at Tser Pool, near Tser Falls. Madame Eva lives here. The Game of Stories and the full Tarokka reading happened here. Arturi, Slaromir, and Eliza are among the Vistani.",
      subLocations: ["Madame Eva's Wagon"]
    },
    "Madame Eva's Wagon": {
      description: "The mobile home of the Vistani seer, Madame Eva, who provides guidance and prophecy to those who seek it."
    },
    "Yester Hill": "A ritual site where Strahd's enemies gather, marked by standing stones and stormy skies. Ancient hill sacred to the druids. The Gultiest tree is here. Strahd appeared at the top on his Nightmare horse. Thirteen cloaked figures formed a circle at the base. A stone statue with fangs stood at the centre. The whispering wall is at the base of the hill. May be connected to the Forest Fane.",
    "Wizard of Wines / Winery": "A hidden winery producing rare wines and brewing resistance against Strahd's rule. Davian Martikov's winery and the Keepers of the Feather economic base. Three stolen gemstones powered its magical grape-growing. Druids defeated — Winter Splinter destroyed in Session 33. Has a hidden trapdoor in nearby woods leading to a cavern below.",
    "Old Bonegrinder Mill": "A mill run by a coven of hags, known for its dangerous pastries and dark bargains. Morgantha's former home. Dream Pies were made here. Hags defeated. Franz's children found hidden upstairs. The party believes this and the 'Old Durst Mill' on the map are the same location referenced at different points in time.",
    "The Amber Temple": "A cursed temple in the mountains where forbidden lore and dark entities dwell. Critical destination. Travel through Argynvostholt to get there. Strahd confirmed it has 'noticed' Flint. This is where Strahd made his pact with the Dark Powers. The Sunsword (Tarokka Card 3) is very likely hidden here. Seriac/Norganas wants Flint here.",
    "Castle Ravenloft": "Strahd's home. Named after his mother Ravenovia. He sleeps far below it, among the dead beneath the stones — but will move to its heights when the party comes for him (Tarokka Card 5). His conquered wealth is buried beneath the belfry. Bats constantly fly toward it. Per Van Richten's secondhand account from his own failed assault years ago: a grand staircase leads up from the main hall, and a \"hall of bones\" (likely a trophy room, possibly holding Lord Argynvost's remains) lies somewhere within. The castle is patrolled by undead — animated armor, phantom warriors, wights, zombies, spectres — and reportedly has teleportation traps and magical shortcuts; Strahd himself is rumored to be able to pass through walls.",
    "Lake Baratok": "Remote mountain lake in the northwest. Kazan's Tower sits on a causeway into it. Van Richter was based here. The hills above it were confirmed in Session 40 to hold the Wolf Den, where the Holy Symbol of Ravenkind (Tarokka Card 2, retrieved Session 41) was kept at Mother Night's Shrine.",
    "Argynvostholt": "Ruined mansion of the Order of the Silver Dragon, founded by the silver dragon Lord Argynvost. This is the 'House of the Fallen Dragon' — a required step before finding the Sunsword. Explored across Sessions 41–45: the Chapel of Mourning (the bound revenant Sir Godfrey Gwilym), a wine cellar hiding two vow rings, Argynvost's own bedchamber, a lead-lined vault, a stained-glass gallery, and Argynvost's mausoleum in a walled cemetery. A cleared spider-infested ballroom leads to Commander Vladimir Horngaard's audience hall, a war room, and his guarded tower — his oath keeps Strahd eternally trapped, and he refuses to release it. A gargoyle's prophecy suggests the beacon can't be lit until Argynvost's remains (likely a trophy inside Castle Ravenloft) are returned to his tomb.",
    "Ruins of Berez": "An old ghost-town in the southern swamps. Baba Lasaga is based here. She created the flying blights and stole the Red Dragon Crush gemstone.",
    "Durst Mansion (Death House)": "A sinister mansion in Barovia village, the entry point to a deadly house of horrors.",
    "Village of Barovia": "The first village the party entered. Site of the undead assault and Kolyan's funeral. Father Donavich's church with Doru in the undercroft. The Blood of the Vine Tavern is the main gathering point. Kolyan found Ireena in the nearby Slavich Woods.",
    "The Blood of the Vine Tavern": "A popular tavern in the Village of Barovia, serving as a gathering place for adventurers and locals alike.",
    "Tser Falls": "A scenic waterfall near Tser Pool, often visited by travelers and adventurers seeking respite or information from the Vistani.",
    "Slavich Woods": "A dense forest near the Village of Barovia, home to various creatures and the site of many dark events, including the discovery of Ireena.",
    "The Old Svalich Road": "A treacherous road connecting various locations in Barovia, often patrolled by Strahd's minions and fraught with danger.",
    "The Svalich Woods": "A vast and foreboding forest that stretches across Barovia, filled with hidden threats and ancient secrets. Kolyan found Ireena as a child in the Slavich Woods — likely the same area. The Durst children recognised it as familiar.",
    "The Svalich River": "A winding river that flows through Barovia, providing a natural barrier and a source of life for the land, yet also a place of mystery and danger.",
    "Lake Zarovich": "A large, mysterious lake in Barovia, often associated with legends and local folklore, and a place of eerie beauty and danger. Large dark lake north of Vallaki. Ireena recognises it from a dream. Bluto the drunk fisherman uses it. Szoldar and Yevgeni's shack is on its shore. Isek was killed here in Session 23.",
    "The Fanes": "Ancient sacred sites scattered across Barovia, each holding unique powers and secrets. The Forest Fane is a druidic site where the party encountered a spirit and learned about the land's history. The Fanes are connected to the land's magic and the Dark Powers that govern Barovia. Three ancient sacred sites pre-dating Strahd: Swamp Fane (Berez area), Forest Fane (Yester Hill area), Mountain Fane (Tsolenka Pass area). Strahd visited all three and claimed their power — 'thus I have become the Land.' Restoring them could break his connection to Barovia.",
    "Ethereal Plane": "A parallel dimension that overlaps with the material world, accessible through certain magical means and often used by powerful entities to observe or influence events in Barovia. The Wachterhaus cellar sits on a Layline to the Ethereal Plane. Entered via ritual in Fiona's cellar in Session 28. Stella is recovered. Erasmus Van Richten (ghost) lives here. A Gallowspeaker and Night Hag also haunt this layer. A binding circle surrounds the Wachter Estate in this plane.",
    "Wolf Den": "A hidden lair in the hills above Lake Baratok where a werewolf pack resides. Zuleeka and Ilya are caged here, suppressed by silver-spiked collars. Emil Tornesku is the deposed alpha; Kiril is the current brutal pack leader. The party swore an oath in Session 41 to rescue Emil and restore him as alpha, in exchange for the Holy Symbol of Ravenkind, already retrieved from Mother Night's Shrine. A peculiar reflecting pool inside forces visitors to confront visions of their true natures.",
    "Vallaki Vistani Camp": "A Vistani encampment just west of Vallaki, home to Luvash and his daughter Arabelle. Arabelle was kidnapped from here during her 10th birthday celebration (Session 17) and later found safe in Rictavio's wagon. Aragail, Luvash's brother, owes the party a favor after they protected Arabelle's rescue. Distinct from the Tser Pool Encampment further east, where Madame Eva resides.",
    "Luna Lake": "A lake south of Argynvostholt, fed by the Luna River that runs down from Lake Zarovich past Vallaki. The Order's mass grave lies along its southern shore, and a peninsula shrine to the Huntress sits nearby — site of the dying, cursed elk and the mysterious swamp witch encountered in Session 42.",
    "The Order's Burial Ground": "A mass grave south of Luna Lake where nearly a thousand fallen knights of the Order of the Silver Dragon are buried. Funeral vestments recovered here in Session 42 let the party move disguised through Argynvostholt's hostile spirits. A pack of ghouls attacked the party while they dug; one was captured and interrogated before being released."
  };

  function showInfo(locationName) {
    const panel = document.getElementById('info-panel');
    const title = document.getElementById('location-name');
    const desc = document.getElementById('location-desc');

    const entry = locationInfo[locationName];

    if (!entry) {
      title.innerText = "Unknown Location";
      desc.innerHTML = "No information recorded for: " + locationName;
      panel.classList.remove('hidden');
      return;
    }

    title.innerText = locationName;

    // Handle both flat strings and structured objects
    const description = typeof entry === 'string' ? entry : entry.description;
    let html = `<p>${description}</p>`;

    // If there are sub-locations, render them as clickable buttons
    if (entry.subLocations && entry.subLocations.length > 0) {
      html += `<hr style="border-color: #561c1c; margin: 12px 0;">`;
      html += `<p style="color: #a1a1aa; font-size: 0.85rem; margin-bottom: 8px;">LOCATIONS WITHIN</p>`;
      entry.subLocations.forEach(sub => {
        html += `<button
          type="button"
          onclick="showInfo('${sub.replace(/'/g, "\\'")}')"
          style="display:block; width:100%; text-align:left; margin-bottom:6px; padding:8px 10px;
                 background:#1a1a1c; border:1px solid #561c1c; border-radius:4px;
                 color:#f87171; cursor:pointer; font-family:Georgia,serif; font-size:0.9rem;">
          📍 ${sub}
        </button>`;
      });
    }

    // Back button if this is a sub-location
    const parentEntry = Object.entries(locationInfo).find(([key, val]) =>
      typeof val === 'object' && val.subLocations && val.subLocations.includes(locationName)
    );
    if (parentEntry) {
      html += `<hr style="border-color: #561c1c; margin: 12px 0;">`;
      html += `<button
        type="button"
        onclick="showInfo('${parentEntry[0]}')"
        style="display:block; width:100%; text-align:left; padding:8px 10px;
               background:#1a1a1c; border:1px solid #2e2e33; border-radius:4px;
               color:#a1a1aa; cursor:pointer; font-family:Georgia,serif; font-size:0.85rem;">
        ← Back to ${parentEntry[0]}
      </button>`;
    }

    desc.innerHTML = html;
    panel.classList.remove('hidden');
  }
</script>
